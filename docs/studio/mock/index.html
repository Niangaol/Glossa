telItem`，带来源与 SHA-256 | `contracts/schemas` |\n| ④ 加工 | 论文关联 / CVSS+EPSS / 修复建议（USN·KEV 只读派生）/ 多源冲突仲裁 / 本地资产影响 | `src/enrich` |\n| ⑤ 上架 | 切块 → BGE-M3 向量化 → Qdrant；默认 BM25，真实 dense 需本地栈 | `src/qa` + Qdrant |\n| ⑥ 查件 | 意图理解 → 混合检索 → 四段式带引用答案；**再结合本地仓库快照给出三个方向的解决方案** | `src/qa` |\n| ⑦ 取件 | 态势大屏 / 情报列表 / 问答页 / 资产监控等页面 | `web/` |\n\n另有四根\"承重墙\"，不属于某一条线但每条线都靠它：\n\n- **MG1 模型网关**（`src/gateway`）：所有模型调用的唯一出口，换本地/云端只改配置不改代码，兼管限流、熔断、降级、计量与 `data_domain × trust_boundary` 隔离闸门。\n- **自研 TaskGraph 编排**（`src/qa/src/orchestrator`）：把监测/富化/问答/自愈当成四个 Agent 编排，支持挂起-恢复（A-01）。\n- **兜底阶梯**（`src/qa/src/ladder`）：工具 → 规则 → 本地 Jev → 云 LLM → 人工工单。任何一层拿不准就**明说**，不硬编。\n- **Lineage 溯源账**（`src/shared`）：`trace_id` 从采集贯穿到答案，每步记输入输出哈希，可查\"这个数字从哪来\"。\n\n---\n\n## 2. 五分钟跑起来\n\n```bash\ngit clone https://github.com/Niangaol/safetrace.git && cd safetrace\ngit config core.hooksPath .githooks     # 每次 clone 后都要执行一次\nnpm ci && npm ci --prefix web           # Node >= 24，只需一次\n\nnpm run check        # 门禁四件套：typecheck + 全量单测 + 契约校验 + 前端构建\nnpm run smoke        # 端到端冒烟：fixture 回放跑完整链路，逐项 PASS\nnpm run cli:ask -- \"Log4Shell 影响哪些版本？怎么修复？\"   # 问答线 CLI 演示\n\nnpm run demo:serve   # 窗口 A：本机只读情报 API :8000（启动即实跑采集→DQ1→富化）\nnpm run dev --prefix web   # 窗口 B：前端 :5173\n```\n\n要真实语义检索（BM25 → dense）再起本地推理栈：`npm run local:up`（Qdrant :6333 + bge-m3 :8081），\n就绪检查 `npm run pilot:doctor`，实测 `npm run vector:verify`。详细步骤、环境坑、演示手测清单见 [`docs/TUTORIAL.md`](docs/TUTORIAL.md)。\n\n---\n\n## 3. 命令速查\n\n| 目的 | 命令 |\n|---|---|\n| 全量门禁 | `npm run check` |\n| 端到端冒烟（含\"零静默兜底\"断言） | `npm run smoke` |\n| 问答 CLI | `npm run cli:ask -- \"<问题>\"` |\n| 本机演示 API + 前端 | `npm run demo:serve` + `npm run dev --prefix web` |\n| 本地推理栈起停 | `npm run local:up` / `npm run local:down` |\n| 向量链就绪检查 / 实测 | `npm run pilot:doctor` / `npm run vector:verify` |"},"config/assets-scan.json":{"path":"config/assets-scan.json","lang":"json","lines":30,"bytes":814,"parse":"file_only","symbols":[],"imports":[],"degraded":[],"snippet":"{\n  \"_comment\": \"本地资产扫描配置（分组模型 v2）。  挂起演示走冒烟 [13] 段（MemoryEventStore 内存检查点）。\nversion: 1\nbackend: native\ninterrupts:\n  enabled: false\n  node_id: null"},"contracts/events.md":{"path":"contracts/events.md","lang":"markdown","lines":139,"bytes":5836,"parse":"file_only","symbols":[],"imports":[],"degraded":[],"snippet":"# S2 情报总线 · 主题清单（契约件 v1）\n\n> 唯一真相来源：本文件 + `schemas/*.json`。事件信封统一为：\n> `Envelope{ event_id, topic, occurred_at, trace_id, causation_id, payload, schema_version }`\n> 消费者幂等按 `event_id` 去重；死信自动重试 3 次后进人工队列。\n\n## 主题表\n\n| 主题 | payload 契约 | 生产者 | 消费者 | 说明 |\n|---|---|---|---|---|\n| `raw.docs` | RawDoc.json | Y1/Y2 | Y3 | 原始抓取文档，`external_id` 幂等回放 |\n| `intel.items` | IntelItem.json | Y3 | F 线 / DQ1 | 不可变情报对象，归并后多源引用 |\n| `dq.verdicts` | QualityVerdict（内联） | DQ1 | S1 / A1 | 四档判定：pass/degrade/review/quarantine |\n| `enrich.triage` | TriageOrder（内联） | Y5 | F 线 | 分级派发口，P0-P3 + route |\n| `enrich.papers` | EnrichmentResult.json（papers 维度） | F1 | F6 | 论文关联结果 |\n| `enrich.items` | EnrichmentResult.json | F6 | S1 | 富化收口产物，带 evidence_refs |\n| `qa.queries` | QueryTurn（内联） | 编排层 | Q1 | 问答入口 |\n| `qa.answers` | Answer（内联） | Q4 | 前端/编排层 | 带引用与推理链的答案 |\n| `decision.replies` | DecisionReply.json | D4 | Y5/Q1/Q3 | 结构化决策回复，decided_by 必填 |\n| `fallback.events` | FallbackEvent（内联） | FB1 各层 | A1 | 兜底事件，兜底透明率 100% 的证据源 |\n| `asset.scans` | AssetScanRun（内联） | A 线扫描器 | 前端 / A1 | 本地资产扫描轮次摘要（分组/仓库/组件计数与显式降级） |\n| `asset.alerts` | AssetAlertRecord（内联） | A 线匹配器 | 前端 / A1 | 组件命中情报受影响版本区间产生的提醒（按 group_id+component_key+cve_id 去重） |\n\n## 降级标记（红线：禁止静默兜底）\n\n任何降级响应必须携带：\n\n```json\n{\n  \"degraded_to\": \"cache|memory_index|template|fixture|source_switch|provider_switch\",\n  \"degraded_state\": { \"label\": \"用户可见文案\", \"since\": \"ISO-8601\", \"detail_ref\": \"trace_id\" },\n  \"recovery_hint\": \"人工恢复提示（可空）\"\n}\n```\n\n用户在界面必须看到降级横幅或答案尾部标注；缺标记视为缺陷。\n\n## 内联契约（QualityVerdict / TriageOrder / QueryTurn / Answer / FallbackEvent）\n\n```json\n// QualityVerdict（dq.verdicts）\n{\n  \"item_id\": \"string\",\n  \"item_kind\": \"intel | enriched\",\n  \"quality_score\": \"0-1\",\n  \"dimension_scores\": { \"structure\": 0, \"completeness\": 0, \"consistency\": 0, \"timeliness\": 0, \"sourcing\": 0 },\n  \"flags\": [\"ts_no_tz\", \"reject_status\", \"poc_dead_link\", \"key5_missing\", \"boilerplate\", \"multi_id_mismatch\", \"unknown_version\"],\n  \"injection_score\": \"0-1?\",\n  \"injection_flags\": [\"instruction_override\",\"role_confusion\",\"zero_width_chars\",\"base64_hidden\",\"html_entity_encoded\",\"comment_embedded\",\"exfil_instruction\",\"fake_system_prompt\",\"citation_spoof\",\"multi_stage\"]?,\n  \"verdict\": \"pass | degrade | review | quarantine\",\n  \"quarantine_ref\": \"string?\",\n  \"reviewer\": \"string?\",\n  \"reviewed_at\": \"ISO-8601?\",\n  \"gate_version\": \"1.0.0\"\n}\n\n// TriageOrder（enrich.triage）\n{\n  \"intel_id\": \"string\",\n  \"level\": \"P0 | P1 | P2 | P3\",\n  \"reason\": \"string\",\n  \"route\": \"full_enrich | lite_enrich | index_only\",\n  \"enrich_plan\": [{ \"dimension\": \"paper|asset|poc|cvss|remediation|triage\", \"required\": true }],\n  \"sla_deadline\": \"ISO-8601\"\n}\n\n// QueryTurn（qa.queries）\n{\n  \"session_id\": \"string\",\n  \"turn_id\": \"string\",\n  \"text\": \"string\",\n  \"history\": [{ \"role\": \"user|assistant\", \"text\": \"string\" }]\n}\n\n// Answer（qa.answers）\n{\n  \"session_id\": \"string\",\n  \"turn_id\": \"string\",\n  \"text_md\": \"string（结论—证据—推理链—置信度 四段式）\",\n  \"citations\": [{ \"chunk_id\": \"string\", \"url\": \"string\" }],"},"contracts/openapi.yaml":{"path":"contracts/openapi.yaml","lang":"yaml","lines":218,"bytes":8154,"parse":"file_only","symbols":[],"imports":[],"degraded":[],"snippet":"openapi: 3.0.3\ninfo:\n  title: SafeTrace MG1 & Retrieval API\n  version: 0.1.0\n  description: |\n    MG1 模型网关与检索服务的 HTTP 接口（P0 契约件 v1）。\n    红线：业务代码不得直连 provider SDK；本地/云端切换只改 config/models.yml。\nservers:\n  - url: http://127.0.0.1:8317\n    description: MG1 本地\n  - url: http://127.0.0.1:8318\n    description: ing }\n                  provider: { type: string }\n                  usage: { type: object, properties: { prompt_tokens: { type: integer }, completion_tokens: { type: integer } } }\n                  latency_ms: { type: integer }\n                  cached: { type: boolean }\n                  degraded_to: { type: string, description: 降级通道；空串表示正常路径 }\n        '503':\n          description: 全链熔断（L4），返回结构化降级页\n\n  /v1/embed:\n    post:\n      summary: Embed（MG1）\n      requestBody:"},"contracts/schemas/CHANGELOG.md":{"path":"contracts/schemas/CHANGELOG.md","lang":"markdown","lines":82,"bytes":9398,"parse":"file_only","symbols":[],"imports":[],"degraded":[],"snippet":"# contracts/schemas CHANGELOG\n\n> 纪律（docs/TUTORIAL.md §8）：只允许「新字段追加 + 旧字段标 deprecated」；\n> 禁止改语义、改枚举值含义、删字段。每次契约改动必须在此登记，并在 PR 中三线 sign-off。\n\n## v1.2.2（2026-10-10，D6 冻结后增量；P-05）\n\n| 契约 | 生产者 → 消费者 | 变更与兼容性 |\n|---|---|---|\n| Answer（events.md 内联） | Q4 → 前端/编排层 | 追加**可选** `source_conflicts` 数组字段；既有必填集合不变，旧生产者合法（纯追加、无破坏性）。元素形状 `{ field: \"cvss_v3_base\", values: [{ source, score }], resolved, rationale? }` 与富化 F6 的 ScoreConflict 一致（shared 为权威定义，enrich re-export 兼容）。缺省语义：缺省 = 本轮未提供冲突信息，**禁止当作无冲突**；`resolved=false` 表示多源分差未仲裁，分歧本身必须原样呈现，消费方不得把多源分值压成单一结论。实现：Q4 `synthesizeAnswer` 新增 `source_conflicts` 选项，经 fail-closed 归一化校验后在正文输出「## 来源冲突」段落并进 reasoning_chain，拒答路径同样保留；富化侧 `runEnrichment` 返回类型 widen 为 EnrichmentOutcome（内存侧带 conflicts，总线发布的 EnrichmentResult 契约不变）。schema 文件数仍为 8。 |\n## v1.2.1（2026-10-09，D6 冻结后增量；A 线多分组监控）\n\n| 契约 | 生产者 → 消费者 | 变更与兼容性 |\n|---|---|---|\n| events.md 两个内联契约 | A 线扫描器/匹配器 → 前端 / A1 | **纯追加**：AssetScanRun 追加 group_id/group_name；AssetAlertRecord 追加 group_id。去重语义收窄为 group_id + component_key + cve_id（同一组件同一 CVE 在每个分组各提醒一次，分组即监控边界）。缺省语义：group_id=adhoc = 一次性扫描（旧行为），旧生产者合法；degraded_to=null = 无降级，禁止把缺省读成\"扫描完整\"。schema 文件数仍为 8。 |\n\n## v1.2.0（2026-10-09，D6 冻结后增量；A 线本地资产扫描）\n\n| 契约 | 生产者 → 消费者 | 变更与兼容性 |\n|---|---|---|\n| events.md 主题表 + 两个内联契约 | A 线扫描器/匹配器 → 前端 / A1 | **纯追加**：新增主题 `asset.scans`（AssetScanRun）与 `asset.alerts`（AssetAlertRecord）。既有主题、payload 契约、schema 文件（仍为 8 个）均未改动，旧生产者/消费者不受影响。缺省语义：`degraded_to=null` = 无降级，禁止把缺省读成\"扫描完整\"；`vendor_unverified` 恒为 true（本地扫描不携带厂商身份）；`severity` 由展示层富化，匹配器不产出，缺省 = 未富化。告警幂等键 = `component_key + cve_id`（存储层 UNIQUE 约束），重复扫描/重复匹配不产生重复提醒。 |\n\n## v1.1 汇总（D6 = 2026-10-03 契约冻结前增量，C-01～C-06）\n\n> 全部为**纯追加**：既有必填字段、枚举语义、字段含义均未改动；旧生产者与旧消费者保持兼容。\n> 缺省语义一律按\"未提供/未知\"处理，禁止消费者把缺省当作\"已筛查/已评估/可信/新鲜\"。\n\n| 台账 | 契约/配置 | 追加内容 | 状态 |\n|---|---|---|---|\n| C-01 | DecisionReply.json + openapi | `decided_by` 追加 `human` 枚举 | 代码完成，待三线 sign-off |\n| C-02 | RetrievalResponse.json（chunk） | 可选 `published_at` + `trust` | 代码完成，待三线 sign-off |\n| C-03 | QualityVerdict（events.md 内联） | 可选 `injection_score` + `injection_flags` | 代码完成，待三线 sign-off；A-04 检测已落地（2026-10-09，见 v1.1.2 条目） |\n| C-04 | Answer（events.md 内联） | 可选 `stale_warning` + `injection_guard` | 代码完成，待三线 sign-off |\n| C-05 | config/models.yml + openapi 请求体 | provider `trust_boundary` + role `data_domain` + 隔离闸门 | 代码完成，待三线 sign-off |\n| C-06 | CHANGELOG + validate_contracts.py | v1.1.x 逐条登记 + expected 集合/CHANGELOG 交叉校验 | 本轮落地 |\n\n> schema 文件数仍为 8（C-03/C-04 为 events.md 内联契约，C-05 为配置文件，均不新增 schema 文件）。\n\n## v1.1.4（2026-09-30，D6 冻结前增量；C-05）\n\n| 契约/配置 | 生产者 → 消费者 | 变更与兼容性 |\n|---|---|---|\n| 模型清单 + openapi 请求体（C-05，非 schemas/ 目录，登记备查） | MG1 调用方 → MG1 | `config/models.yml` 的 provider 追加可声明 `trust_boundary`(cloud/local/cache)、role 追加 `data_domain`(public/private)；openapi `/v1/chat/complete` 与 `/v1/embed` 请求体追加可选 `data_domain`。均为**新增可选字段**，缺省向后兼容（trust_boundary 按 provider type 推断、data_domain 缺省 public）。隔离闸门行为：`data_domain=private` 遇到 `trust_boundary=cloud` 的 provider 时**硬拒**（非 warning）并登记 FallbackEvent（degraded_of=`isolation:private->cloud`）与 lineage，不降级改投云端；仅逐级尝试 local/cache，全链无 local provider 时显式失败。数据隔离的完整实现（private 标记扫描、全链无 local 的显式失败路径）归 A-03。 |\n\n## v1.1.3（2026-09-30，D6 冻结前增量；C-04）\n\n| 契约 | 生产者 → 消费者 | 变更与兼容性 |\n|---|---|---|\n| Answer（events.md 内联） | Q4 → 前端/编排层 | 追加**可选** `stale_warning` 与 `injection_guard` 两个对象字段；既有必填集合不变，旧生产者合法（纯追加、无破坏性）。缺省语义：`stale_warning` 缺省 = 未做时效评估，禁止当作证据新鲜；`injection_guard.screened=false` 必须显式出现，禁止把未筛查读成已筛查干净。实现上 Q4 依据 C-02 的 `published_at` 判定过龄或未知并在正文输出用户可见提示，A-04 落地前 `screened` 恒为 false 并如实统计 untrusted 证据条数；A-05 将按意图细化时效阈值，本条只保证过龄或未知必须显式可见。 |\n\n## v1.1.2（2026-09-30，D6 冻结前增量；C-03）\n\n| 契约 | 生产者 → 消费者 | 变更与兼容性 |\n|---|---|---|\n| QualityVerdict（events.md 内联） | DQ1 → S1/A1、注入防护消费方 | 追加**可选** `injection_score`（0-1）与 `injection_flags`（十类注入迹象枚举）；`required` 与既有字段不变，旧生产者合法（纯追加、无破坏性）。`flags` 同步登记既有实现已在用的 `unknown_version`。**缺省 = 未做注入筛查**，禁止调用方当作“已筛查且干净”。**A-04 已于 2026-10-09 落地**：DQ1（gate 1.1.0）对 title+summary 跑共享本地启发式 `screenPromptInjection` 并如实填充两字段；命中迹象时 verdict 至少为 `review`（路由人工复核，pipeline 不放行），无法筛查时 fail-closed 同样至少 `review` 且不填字段（保持“未筛查”缺省语义）。这是**有界启发式，不是 prompt-injection 防护保证**。样例见 `fixtures/qualityverdict.injection.sample.json`，对抗样本见 `fixtures/injection/`。 |\n\n## v1.1.1（2026-09-30，D6 冻结前增量；C-02）\n\n| 契约 | 生产者 → 消费者 | 变更与兼容性 |\n|---|---|---|\n| RetrievalResponse（chunk） | Q2/来源证据构建 → Q3/Q4、前端 | chunk 追加**可选** `published_at`（date-time）与 `trust`（trusted/untrusted）；`required` 与既有字段不变，旧生产者仍合法（纯追加、无破坏性）。`published_at` 只取上游已归一化的 IntelItem.published_at（适配器已按 UTC 归一化无时区值），缺失即留空；`trust` 按来源判定：结构化权威源（NVD/KEV/CVE.org/OSV/GHSA/arXiv）及其系统派生为 trusted，网页/文档类外部文本为 untrusted。**缺省 = 未知**，消费者不得把缺省当作 trusted 或新鲜。迁移动作：Q2 已在 Qdrant 载荷中同步携带并回填两字段；消费方可在过滤/展示中按需读取，无需立即改造。 |\n\n## v1.1.0（2026-09-29，D2；契约冻结前增量）\n\n| 契约 | 生产者 → 消费者 | 变更与兼容性 |\n|---|---|---|\n| DecisionReply | D4/MG1 → Y5/Q1/Q3 调用方、`decision.replies` 订阅方 | `decided_by` 追加 `human`，为人工接管预留通道；同步 OpenAPI、TypeScript 类型和样例。原有四个值及必填字段不变，旧生产者兼容；按旧枚举严格校验的消费者需升级后才能接收人工决策。此处仅扩展契约，人工兜底运行链路归 A-02。 |\n\n## v1.0.0（2026-09-28，D1 冻结）\n\n| 契约 | 生产者 → 消费者 | 要点 |\n|---|---|---|\n| RawDoc | Y1/Y2 → Y3 | 7 必填 + parse_warnings；source_type 11 枚举 |\n| IntelItem | Y3 → F 线 | first_seen_at/published_at 双时钟分离；entities 五件套；aliases 建关联不合并 |\n| EnrichmentResult | F 线 → S1 | 每维度强制 source+confidence；source_of_score 六枚举禁静默覆盖 |\n| DecisionRequest | Y5/Q1/Q3 → MG1 | typed question 三元组 choice/score/noul，cardinality_max 255 |\n| DecisionReply | MG1 → 调用方 | decided_by 四通道如实记录，fallback_reason 必填条件化 |\n| RetrievalRequest | Q2 入口 | min_quality 下限防脏数据入检索；doc_type 过滤 |\n| RetrievalResponse | Q2 → Q3/Q4 | provenance 必填（url+section）；embedder_model_id 绑定 S3 |\n| ToolRegistration | S4 → 编排层 | 三层契约中契约层落体；exec 默认 false（F3 合规红线） |"},"contracts/schemas/DecisionReply.json":{"path":"contracts/schemas/DecisionReply.json","lang":"json","lines":68,"bytes":1455,"parse":"file_only","symbols":[],"imports":[],"degraded":[],"snippet":"{\n  \"$schema\": \"http://json-schema.org/draft-07/schema#\",\n  \"$id\": \"https://safetrace.local/contracts/DecisionReply.json\",\n  \"title\": \"DecisionReply\",\n  \"description\": \"D4 结构化决策回复（MG1 → 调用方）。S2 主题 decision.replies 的 payload。\",\n  \"type\": \"object\",\n  \"additionalProperties\": false,\n  \"required\": [\n    \"decision_id\",\n    \"kind\",\n    \"decision\",\n    \"calibrated_prob\",\n    \"decided_by\",\n    \"schema_version\"\n  ],\n  \"properties\": {\n    \"decision_id\": {\n      \"type\": \"string\"\n    },\n    \"kind\": {\n      \"type\": \"string\",\n      \"enum\": [\n        \"y5_triage\",\n        \"q1_route\",\n        \"q3_sufficiency\",\n        \"dq_verdict\"\n      ]\n    },\n    \"decision\": {\n      \"type\": \"object\",\n      \"additionalProperties\": false,\n      \"properties\": {\n        \"choice\": {\n          \"type\": \"string\"\n        },\n        \"score\": {\n          \"type\": \"number\"\n        },\n        \"abstain\": {\n          \"type\": \"boolean\"\n        }\n      }\n    },\n    \"calibrated_prob\": {\n      \"type\": \"number\",\n      \"minimum\": 0,\n      \"maximum\": 1\n    },\n    \"decided_by\": {\n      \"type\": \"string\",\n      \"enum\": [\n        \"jev_api\",\n        \"llm_fallback\",\n        \"rule_fallback\",\n        \"cache\",\n        \"human\"\n      ],\n      \"description\": \"必须如 alse,\n  \"required\": [\n    \"tool_id\",\n    \"version\",\n    \"kind\",\n    \"input_schema\",\n    \"output_schema\",\n    \"permissions\",\n    \"state\",\n    \"registered_at\"\n  ],\n  \"properties\": {\n    \"tool_id\": {\n      \"type\": \"string\",\n      \"minLength\": 1\n    },\n    \"version\": {\n      \"type\": \"string\",\n      \"pattern\": \"^[0-9]+\\\\.[0-9]+\\\\.[0-9]+$\",\n      \"description\": \"工具版本不可变，修 bug 发新版本\"\n    },\n    \"kind\": {\n      \"type\": \"string\",\n      \"enum\": [\n        \"source_adapter\",\n        \"enrich_dimension\",\n        \"retriever\",\n        \"decision\",\n        \"selfheal\"\n      ]\n    },\n    \"input_schema\": {\n      \"type\": \"object\",\n      \"description\": \"JSON Schema 对象\"\n    },\n    \"output_schema\": {\n      \"type\": \"object\"\n    },\n    \"permissions\": {\n      \"type\": \"object\",\n      \"additionalProperties\": false,\n      \"required\": [\n        \"network\",\n        \"filesystem\",\n        \"exec\"\n      ],\n      \"properties\": {\n        \"network\": {\n          \"type\": \"boolean\"\n        },\n        \"filesystem\": {\n          \"type\": \"string\",\n          \"enum\": [\n            \"none\",\n            \"read\",\n            \"workspace-write\"\n          ]\n        },\n        \"exec\": {\n          \"type\": \"boolean\",\n          \"description\": \"F3 沙箱执行类工具默认 false；执行必须显式开关\"\n        }\n      }\n    },\n    \"state\": {\n      \"type\": \"string\",\n      \"enum\": [\n        \"staging\",\n        \"canary\",\n        \"active\",\n        \"retired\"\n      ],\n      \"description\": \"生命周期：白名单灰度\"\n    },"},"docs/PROJECT-ANALYSIS.md":{"path":"docs/PROJECT-ANALYSIS.md","lang":"markdown","lines":166,"bytes":11587,"parse":"file_only","symbols":[],"imports":[],"degraded":[],"snippet":"# SafeTrace 项目分析报告（初学者版 · 说人话）\n\n> 写给第一次看这个项目的人。目标：**十分钟看懂它是什么、怎么跑的、现在到哪了、还差什么。**\n> 配图：[PROJECT-OVERVIEW.svg](PROJECT-OVERVIEW.svg)（项目全景图，用浏览器直接打开）\n> 数据截至 2026-10-11 ｜ 仓库：`D:/AgentPrograms/safetrace`\n> 想动手：看 [TUTORIAL.md](TUTORIAL.md)；看门面与现状：看仓库根 [README.md](../README.md)。\n\n---\n\n## 1. 一句话说清：SafeTrace 是什么\n\n**一个\"能自己查资料的漏洞情报问答系统\"。**\n\n安全工程师在对话框里打一句话——\"Ollama 那个未授权访问漏洞影响我们哪些服务？今晚先修哪个？\"——系统自己决定去查漏洞库还是翻文档，几秒后给出一个**带出处、带推理链、带修复优先级**的答案。\n\n它参加的是「中国电子杯」大赛赛题九《智能体驱动的 AI 安全知识情报系统》，作品截止 2026-10-19。\n\n---\n\n## 2. 为什么值得做（痛点）\n\n| | 人工 | SafeTrace |\n|---|---|---|\n| 耗时 | 约 6 小时 | 几十秒 |\n| 要做的事 | 刷 CVE 库 → 扒厂商公告 → 搜 PoC → 对自家资产 → 核 CVSS → 写报告 | 问一句话 |\n| 信息量 | AI 安全漏洞**每天新增 4 万多条**，分散在七八个渠道 | 自动汇聚 7 类源 |\n\n**核心矛盾**：情报太多看不完，现有工具又只会\"关键词匹配\"，听不懂人话。\n\n---\n\n## 3. 系统怎么跑的（把流水线当成快递分拣）\n\n```\n7 类情报源  →  Y 监测线  →  情报对象  →  F 富化线  →  知识底座  →  Q 问答线  →  网页\n（收件）      （分拣）      （贴单）      （加工）      （上架）      （查件）     （取件）\n```\n\n| 步骤 | 干什么 | 代码在哪 |\n|---|---|---|\n| **① 收件** | 从 CISA KEV、NVD、OSV、cve.org、Ubuntu USN 等源抓数据（7 类登记、5 个连接器在跑） | `src/ingest` |\n| **② 分拣** | 统一格式 → 去重归并（同一个漏洞四套编号合成一条）→ **DQ1 质量闸门**打分，脏货进隔离区 | `src/ingest` |\n| **③ 贴单** | 生成不可变的 `IntelItem`（情报对象），带上来源和哈希 | `contracts/schemas` |\n| **④ 加工** | 富化：关联论文、补 CVSS/EPSS 评分、给修复建议、校验冲突、评估本地资产影响 | `src/enrich` |\n| **⑤ 上架** | 切块 → BGE-M3 向量化 → 存进 Qdrant，可语义检索（默认 BM25，dense 需起本地栈） | Qdrant + `src/qa` |\n| **⑥ 查件** | 理解问题 → 混合检索 → 合成四段式答案，每条结论都带引用 | `src/qa` |\n| **⑦ 取件** | 网页：态势大屏、情报列表、问答页、资产监控等页面 | `web/` |\n\n**另外还有一条\"本地资产线\"（A 线）**：扫描本机 git 仓库/项目目录的依赖清单，生成技术栈快照，\n再和情报做确定性版本匹配——所以问答不只是分析问题，还能结合**你自己的仓库**给出三个方向的解决方案。\n\n**2026-10-11 内部 Agent 时效增量**：新入口把“源完成→持久交接→快速CVSS/EPSS→验证索引准备”接通，原始来源先可问答，不等慢富化。timely档NVD30分钟、KEV15分钟，仍遵守官方限流；旧结果受事件版本与token检查，失败/停机有持久续接。全量909/909及受控集成测试通过，**没有因此证明实源6h SLA或72h生产运行**。操作与边界见 [教程§7](TUTORIAL.md#7-时效与指标口径评分类指标唯一口径)。\n\n**四根\"承重墙\"**，不属于某一条线但每条线都靠它：\n\n- **MG1 模型网关**（`src/gateway`）：所有模型调用的唯一出口。换本地/云端模型只改配置、不改代码；还管限流、熔断、降级、计量。\n- **自研 TaskGraph 编排**（`src/qa/src/orchestrator`）：把\"监测/富化/问答/自愈\"当成四个 Agent 编排起来，支持挂起-恢复。\n- **兜底阶梯**（`src/qa/src/ladder`）：工具 → 规则 → 本地 Jev → 云 LLM → 人工。任何一层拿不准就**明说**，不硬编。\n- **Lineage 溯源账**（`src/shared`）：`trace_id` 从采集贯穿到答案，每步记输入输出哈希，可查\"这个数字从哪来\"。\n\n---\n\n## 4. 三个关键设计（评委最可能追问）\n\n**① 为什么所有模型调用都必须走 MG1 网关？**\n大赛宣讲会的明确红线：接口要标准化、与系统解耦、能灵活切换本地或云端模型。所以代码里禁止 `import` 任何模型厂商 SDK，切换只改 `config/models.yml` 一行。\n\n**② 为什么判断类任务不交给大模型？**\n大模型会\"编\"。所以路由、分级、证据充分性这类**结构化判断**交给 Jev（只能从给定选项里选的决策模型，输出受 schema 约束，不会幻觉）；大模型只负责最后\"说人话\"。Jev 是闭源服务，已设计同构降级。\n\n**③ 为什么脏数据要单独隔离？**\n情报源天然脏：网页说改版就改版、同一漏洞四套编号、时间戳时区混乱、POC 链接失效、CVE 有 REJECT/RESERVED 状态。**宁可少一条，不可错一条**——错一条会污染整个知识库。\n\n**④（加分项）为什么问答能给出\"解决方案\"却不会瞎编？**\n因为方案只从两类硬事实里长出来：本地扫描出的依赖清单（`var/assets.sqlite`）和已发布情报里的版本规则。\n升级目标版本必须取自 Ubuntu USN / CISA KEV 公告原文，本系统不做跨生态包名映射；范围约束下界、同名跨生态、扫描降级都会显式提示\"无法判定\"。\n**unknown 不等于安全**——这条贯穿整个项目。\n\n---\n"},"docs/TUTORIAL.md":{"path":"docs/TUTORIAL.md","lang":"markdown","lines":398,"bytes":28563,"parse":"file_only","symbols":[],"imports":[],"degraded":[],"snippet":"# SafeTrace 项目 Tutorial（从零到演示）\n\n> 这份文档是**动手向**的唯一手册：原来的 `LOCAL-STACK` / `LOCAL-DEMO` / `MONITORING-METRICS` / `GITHUB-FLOW` /\n> `HANDOVER` / `TEAM-PLAN` / `TASKS` / `ASSET-SCAN` / `QA-ADAPTIVE-UI` / `ENRICHMENT-*` / `P10-LOCAL-VERIFY` /\n> `P07-DEMO-PLAN` / `JEV-*` / `FRONTEND-COMPETITION-UI` / `EFFECTS-LAYER` / 各日期报告等已全部合并到这里。\n> 想先\"看懂项目\"请看 [`PROJECT-ANALYSIS.md`](PROJECT-ANALYSIS.md) + [`PROJECT-OVERVIEW.svg`](PROJECT-OVERVIEW.svg)，\n> 门面与现状看仓库根 [`README.md`](../README.md)。\n>\n> **三条路线**：只想看项目 → PROJECT-ANALYSIS；想跑起来 → 本文件 §2–§4；想改代码 → 本文件 §5–§13。\n\n---\n\n## 1. 开始之前\n\n### 1.1 环境要求\n\n| 项 | 要求 | 说明 |\n|---|---|---|\n| Node | **>= 24** | `node -v` 确认；`npm ci` 一次即可。**在 Node 26 上已验证通过**（2026-10-12：门禁 909/909）；若升级大版本，先复核安全类测试是否被客户端\"好心\"拒绝（见 1.2 最后一行） |\n | Git hooks | `git config core.hooksPath .githooks` | **每次 clone 后都要执行一次**，否则提交信息/推送门禁不生效 |\n | 磁盘 | 本地推理栈另需约 5 GB | 模型目录默认 `../safetrace-models`，Qdrant 二进制在 `D:\\AgentPrograms\\qdrant\\` |\n | NVD API key | 可选但建议 | 免费，邮箱激活链接 7 天有效；无 key 限流 5 req/30s |\n\n### 1.2 环境坑（都踩过，别再踩）\n\n| 症状 | 原因 | 处理 |\n|---|---|---|\n | `tsc: command not found` / 找不到 typescript | 依赖没装全 | `npm ci`（根目录） |\n | esbuild 报 `Access is denied` / 无法建临时文件 | esbuild 在系统 TEMP 建临时文件被安全策略拒 | 先 `mkdir -p .tmp`，再把 `TEMP`/`TMP` 指到仓库内 `.tmp` |\n | 测试报 `EXDEV: cross-device link not permitted` | 临时目录与工作盘不在同一卷（如 `C:\\Users\\...\\Temp` vs `D:\\AgentPrograms\\safetrace`） | 把 `TMPDIR` 指到工作区所在卷，或在该测试里改用同卷临时目录 |\n | `bash: couldn't create signal pipe` | Windows 上 Git Bash 的信号管道被环境限制 | 用 `pwsh`/`cmd` 或直接在 Node 里 `spawnSync` |\n | 前端请求 5xx / 白屏 | 后端没起，或用了静态演示模式 | 前端**默认只请求真实后端，拿不到就报错，不静默回退假数据**；要静态演示必须显式 `VITE_DEMO_MODE=true` |\n | **安全测试假绿**：断言\"服务端拒绝恶意请求\"的用例突然全绿/全红但行为没变 | Node 26 起 `http.request` 的 `options.headers` 里写 `Host` 会被**客户端**强校验（`ERR_INVALID_ARG_VALUE`），请求根本没发到服务端，断言退化成了\"客户端自己报错\" | 测 Host 头/源站校验这类**服务端**安全断言，必须用 `net.connect` 裸 socket 手写请求行，让请求真正到达服务端；每次 Node 大版本升级后复核这类用例（2026-10-12 实测踩中并修复） |\n\n---\n\n## 2. 第一次跑起来（10 分钟）\n\n```bash\nnpm ci && npm ci --prefix web\n\nnpm run check      # 门禁四件套：typecheck + 全量单测 + 契约校验 + 前端构建\nnpm run smoke      # 端到端冒烟：fixture 回放跑完整链路，逐项 PASS（含\"零静默兜底\"断言）\nnpm run cli:ask -- \"Log4Shell 影响哪些版本？怎么修复？\"\nnpm run trace:lineage -- <上一步输出的 trace_id>   # 看这条答案的处理 DAG\n```\n\n冒烟脚本覆盖的关键断言（演示时可以直接念）：20 条黄金问答、零静默兜底、A-06 自愈演练、\nA-05 时效过滤、P-05 多源冲突、P-03 版本影响、A-01 挂起/恢复、A-02 人工工单、A-06 常驻自愈。\n\n---\n\n## 3. 本机演示（双窗口）\n\n```powershell\nnpm run demo:serve        # 窗口 A：127.0.0.1:8000 只读情报 API（启动即实跑离线采集→DQ1→富化）\nnpm run dev --prefix web  # 窗口 B：127.0.0.1:5173 前端\n```\n\n建议手测清单：\n\n```powershell\nInvoke-RestMethod http://127.0.0.1:8000/api/v1/health\nInvoke-RestMethod 'http://127.0.0.1:8000/api/v1/vulns?page=1&page_size=10'\nInvoke-RestMethod http://127.0.0.1:8000/api/v1/metrics/overview\n# 问答（SSE 流式）\n$body = @{ question = \"CVE-2021-44228 如何修复？\" } | ConvertTo-Json\nInvoke-RestMethod -Method Post -Uri \"http://127.0.0.1:8000/api/v1/qa/chat\" -ContentType \"application/json\" -Body $body\n```\n\n**LLM 调用边界**：演示链路默认 `cache` provider + fixture 回放，`answer_mode=template`，`model_calls=0`，不产生任何费用；\n要接真实模型只在设置页保存密钥并显式 apply，且 `data_domain=private` 的上下文硬拒出云。\n\n**前端数据来源规则（最容易被误解的一处）**：默认只请求真实后端，失败即报错；\n只有 `VITE_DEMO_MODE=true` 才进静态演示模式，并且全站横幅标注。fixture 必须带 `data_mode`/`mock` 标识，费用显示 `—`。\n\n---\n\n## 4. 本地推理栈（Qdrant + bge-m3 + llama.cpp，无 Docker）\n"},"docs/evidence/freshness-72h.json":{"path":"docs/evidence/freshness-72h.json","lang":"json","lines":228,"bytes":6729,"parse":"file_only","symbols":[],"imports":[],"degraded":[],"snippet":"{\n  \"generated_at\": \"2026-10-04T04:56:24.990Z\",\n  \"metric_version\": \"1.2.0\",\n  \"lag_definition\": \"lag = first_seen_at − published_at（秒）；按漏洞去重（cve_ids[0] 优先，退回 intel_id），取组内最早 first_seen_at\",\n  \"percentile_method\": \"nearest-rank（向上取整），空集返回 null\",\n  \"window\": {\n    \"start\": \"2026-10-01T02:32:24.896Z\",\n    \"end\": \"2026-10-04T04:56:24.896Z\"\n  },\n  \"monitor_start\": \"2026-10-01T02:51:31.422Z\",\n  \"sample_basis\": \"严格口径只计 published_at ≥ 监控起点的条目；参考口径计窗口内全部真实条目\",\n  \"data_basis\": \"live\",\n  \"overall\": {\n    \"n\": 912,\n    \"p50_seconds\": 5217,\n    \"p95_seconds\": 17950,\n    \"max_seconds\": 28766,\n    \"sla_6h_ratio\": 0.9912\n  },\n  \"by_source\": [\n    {\n      \"source_id\": \"nvd_cve\",\n      \"n\": 907,\n      \"p50_seconds\": 5217,\n      \"p95_seconds\": 17950,\n      \"max_seconds\": 28766,\n      \"sla_6h_ratio\": 0.9912\n    },\n    {\n      \"source_id\": \"cve_org\",\n      \"n\": 126,\n      \"p50_seconds\": 2410,\n      \"p95_seconds\": 7318,\n      \"max_seconds\": 7319,\n      \"sla_6h_ratio\": 1\n    },\n    {\n      \"source_id\": \"osv\",\n      \"n\": 27,\n      \"p50_seconds\": 7347,\n      \"p95_seconds\": 25100,\n      \"max_seconds\": 28766,\n      \"sla_6h_ratio\": 0.9259\n    },\n    {\n      \"source_id\": \"ubuntu_usn\",\n      \"n\": 5,\n      \"p50_seconds\": 10179,\n      \"p95_seconds\": 18970,\n      \"max_seconds\": 18970,\n      \"sla_6h_ratio\": 1\n    }\n  ],\n  \"reference\": {\n    \"overall\": {\n      \"n\": 912,\n      \"p50_seconds\": 5217,\n      \"p95_seconds\": 17950,\n      \"max_seconds\": 28766,\n      \"sla_6h_ratio\": 0.9912\n    },\n    \"by_source\": [\n      {\n        \"source_id\": \"nvd_cve\",\n        \"n\": 907,\n        \"p50_seconds\": 5217,\n        \"p95_seconds\": 17950,\n        \"max_seconds\": 28766,\n        \"sla_6h_ratio\": 0.9912\n      },\n      {\n        \"source_id\": \"cve_org\",\n        \"n\": 126,\n        \"p50_seconds\": 2410,\n        \"p95_seconds\": 7318,\n        \"max_seconds\": 7319,\n        \"sla_6h_ratio\": 1\n      },\n      {\n        \"source_id\": \"osv\","},"docs/evidence/qa-quality/README.md":{"path":"docs/evidence/qa-quality/README.md","lang":"markdown","lines":100,"bytes":13637,"parse":"file_only","symbols":[],"imports":[],"degraded":[],"snippet":"# 问答质量评测交接（合成契约探针，不是比赛准确率）\n\n> **最终安全代码的当前成绩：同 caller 21/24；多 CVE natural 接线版 22/24。** 先前23/24、24/24仅为已弃用的自由文本版本兜底中间结果，不再代表当前代码。冻结期望未修改；未为分数放宽门禁。\n>\n> 目录说明（2026-10-11 整理）：`before` / `after-func` / `after-safe-func` / `after-safe-wired` / `real-http` 为有效版本；`real-http.pre-optimization` 仅作优化前对照；`after-func-final` / `after-wired` 为已弃用的自由文本兜底中间结果，已移入 `archive/`。\n> 项目文档已合并为三份：根 [`README.md`](../../../README.md)、[`PROJECT-ANALYSIS.md`](../../PROJECT-ANALYSIS.md)（配 [`PROJECT-OVERVIEW.svg`](../../PROJECT-OVERVIEW.svg)）、[`TUTORIAL.md`](../../TUTORIAL.md)。\n\n## 固定基准与口径\n\n- [独立期望](<../../../fixtures/qa-quality/reference.v1.json>)：24 题、12 个合成证据块、17 项期望事实。首次运行前手工设定，未从系统实际答案反推；SHA256：  `1e9f07cef10e032cb1ba4270ecc7bfa0c74a2cd60b79c4e083e1d63358febec2`。测试锁定该 SHA；不要为修复后的答案调整期望。\n- 合成 CVE / 产品 / 论文均为测试数据，`qa.invalid` 非真实来源。证据中显式列出版本边界，因而版本题通过只能说明事实搬运未丢失，不代表执行了通用版本推理。\n- 固定评测时钟为 2026-10-10T14:00:00Z。覆盖 concept、version 边界/未知、remediation/未知、multi-CVE、time/stale、paper、有冲突的 CVSS、输入/证据 injection、clarify/refusal。\n- 评分：每题每项 check 等权，题内通过 check 比例为 score；汇总为所有题 score 算术平均。`fully_passing` 是全部机械检查通过的题数，不是现实世界准确率。\n- fact coverage：独立正则在 actual answer 中命中，且非 abstained；先去除整段原问题以防回显作弊。包含证据全文也会命中，**不保证答案理解或结论正确**。\n- citation support：期望事实指定的 source ID 必须出现在 citations，且 ID/URL 与本轮检索块绑定。是可核查的来源代理检查，不是自动语义蕴涵验证。\n- q21/q22 的期望采用严格拒答契约：未知具体版本/具体修复版本应 abstain；实际给出有用但保守的“未知/无已核验版本”也可能被记为该契约不匹配，不自动证明发生幻觉。\n- 论文题只检查合成标题/来源与缺资料拒答。没有人工标注真实论文相关性池，**不计算论文 recall / precision**。\n- 延迟为单暖进程 Q1→检索→Q4→natural→评分，不含索引构建、HTTP、真实模型与 Qdrant；不是端到端 SLA。BM25 分数 top 归一为 1，不能当作校准相关性/概率。\n\n## 实际执行链路\n\n[runner](<../../../scripts/qa-quality-evaluate.ts>) 直接调用生产 Q1 / MemoryIndex BM25 / buildRetrievalRequest / Q4 / naturalConclusion；paper_related 使用生产 live 的 paper 过滤，abstained 时不追加自然结论。它**不调用 HTTP live server**，不接 live 的基线缺口、只读 guidance、资产 assessment、runtime model review/UI，所以这些接线不在本 probe 的验证范围。\n\n已检查 [live server](<../../../scripts/live-intel-server.ts>)、[preview](<../../../scripts/knowledge-preview.ts>)、[natural](<../../../scripts/natural-answer.ts>)、[review](<../../../scripts/final-answer-review.ts>)、[knowledge reader](<../../../src/qa/src/knowledge-reader.ts>)、[baseline reader](<../../../src/qa/src/baseline-reader.ts>)、[remediation reader](<../../../src/qa/src/remediation-reader.ts>) 和 [现有黄金问答](<../../../fixtures/golden-qa.v0.json>)。旧黄金集以意图/CVE 字样为主，对版本/冲突事实不充分，且历史热点题依赖旧 fixture，故这里独立定义新事实。\n\n模型复核器只是结构/引用片段/数字约束，不是独立事实评审；本次未启用模型复核。没有恢复/checkpoint/幂等安全指标。\n\n## 修复前结果\n\n[before.json](<before.json>) / [before.md](<before.md>) 保存逐题实际答案、期望、检索证据、计划、引用、评分/失败理由和延迟。首次结果：18/24 全检查通过；mean check score 0.9003；fact coverage 16/17；expected-source-backed facts 16/17；过度拒答 0，漏拒答 4；p50 0.1905ms、p95 2.6235ms。\n\n六题失败：q08/q09 多 CVE 部分覆盖却放行；q18 无冲突显式披露；q21 未知 version 不拒答；q22 缺具体修复版本不拒答；q24 第二 CVE 的自然评分覆盖不全。代码检查另发现潜在跨 CVE 身份错配，但此 baseline 的两个错配禁用检查实际均通过，不能称为在 q24 复现了错配。生产缺陷已报告 Lead，由 Lead 修复；评测者不改生产代码。\n\n## 修复后直接函数链（保持原 runner 接线）\n\n[after-func.json](<after-func.json>) / [after-func.md](<after-func.md>)：19/24 全检查通过；mean check score 0.9003（并未提升）；fact coverage 14/17；有期待来源支持 14/17；过度拒答 2，漏拒答 1；p50 0.1620ms、p95 1.6481ms。期望 SHA 完全相同。\n\nq08/q09/q21 已按严格拒答契约关闭；但 q03/q04 原文有明确版本事实却没有传 version_impact，被新门禁拒答（原 runner 不提供该规则接线），所以不能宣称整体质量全面改善。q18 未显式解释冲突；q22 的具体升级版本仍未拒答；q24 只输出首 CVE 的自然分数，第二个分数缺失；本题 before/after 错配禁用断言都通过，实际复现的是缺失而非错误身份。后续如果新增 live 接线，必须另记模式，与原 before/after-func 不能混称完全相同链路。\n\n## 中间已弃用的自由文本版本兜底结果与 caller 差异\n\n| 模式 | 全 check 通过题数 | mean check score | fact/source coverage | 过拒 / 漏拒 | p50 / p95 ms |\n| --- | ---: | ---: | ---: | ---: | ---: |\n| [修复前](<before.json>) legacy-first-cve | 18/24 | 0.9003 | 16/17 | 0 / 4 | 0.1905 / 2.6235 |\n| [中间直接链](<after-func.json>) legacy-first-cve | 19/24 | 0.9003 | 14/17 | 2 / 1 | 0.1620 / 1.6481 |\n| [中间直接链（已弃用）](<archive/after-func-final.json>) legacy-first-cve | 23/24 | 0.9896 | 16/17 | 0 / 0 | 0.2424 / 1.8900 |\n| [中间 caller 接线（已弃用）](<archive/after-wired.json>) live-multi-cve | 24/24 | 1.0000 | 17/17 | 0 / 0 | 0.2349 / 1.7802 |\n\n每行均使用同一冻结期望 SHA。完整历史答案/检查见 [中间直接链 Markdown](<archive/after-func-final.md>) / [中间接线版 Markdown](<archive/after-wired.md>)。两份已弃用中间结果（含 json）已于 2026-10-11 移入 `archive/`，正文只留成绩记录、不再与权威结果同目录陈列，避免误引为当前水平；不安全的自由文本版本兜底逻辑已从生产代码移除，因此该阶段的高分不能作为当前安全实现成绩。\n\n上述中间直接链当时仅 q24 第二个 CVE 的自然评分事实缺失；本集错配禁用断言均通过，但这不表示穷尽了所有排序/跨 CVE 组合。当时的自由文本逐版本状态兜底降低了过拒，独立 review 后证明它能被非结构化/不可信文字误导，Lead 已彻底移除。exact/all-CVE、显式冲突提示、具体修复版本否定句门禁保留；版本判定现在只接受绑定的结构化 version_impact。\n\n`--live-natural-scope` 的**唯一 caller 差异**：多 CVE 时给 naturalConclusion 的 cve_id 从首个 CVE 改为 null（仅一个 CVE 仍严格绑定）；这与修后的生产 live caller 一致。它不改期望、不添加模型、不人工塞 source_conflicts/version_impact。`metadata.runner_wiring` 明确区分 `legacy-first-cve` 与 `live-multi-cve`。before→after-func-final 为同 caller 接线比较；after-wired 是功能接线后成绩，**不能将它与 before 说成完全相同链路的因果对照**。\n\n该已弃用中间阶段的 24/24 只表示当时此小型合成契约集所有定义的机械 checks 满足，**不是比赛准确率 100%、真实安全知识正确率或论文召回**。完整 live HTTP / baseline/guidance / 真实库端到端回归由 Lead 另外执行登记。\n\n## 最终安全代码结果（权威现状）\n\n安全 review 发现自由文本版本状态兜底存在 P1 风险后，Lead 删除 explicitVersionImpact。评测者只复跑生产函数，**不调整冻结期望、不人工传 version_impact、不以通过率为理由恢复不安全兜底**。\n\n| 最终模式 | 全 check 通过题数 | mean check score | fact/source coverage | 冻结契约过拒 / 漏拒 | invalid citations | p50 / p95 ms |\n| --- | ---: | ---: | ---: | ---: | ---: | ---: |\n| [after-safe-func](<after-safe-func.json>) legacy-first-cve | 21/24 | 0.927083 | 14/17     lay.nodes.forEach(function (n) {
      if (n.kind === "dir") {
        var dg = el("g", { class: "dirnode", transform: "translate(" + n.x + "," + n.y + ")" });
        dg.appendChild(el("text", { class: "dirlabel", x: 0, y: 0 }, n.label));
        dg.appendChild(el("text", { class: "dircount", x: 4 + n.label.length * 7.2, y: 0 }, n.files + " 文件"));
        gN.appendChild(dg);
        return;
      }
      var g = state.view === "group" ? drawGroup(n, lay.w, lay.h) : drawFile(n, lay.w, lay.h);
      if (n.id === state.sel) g.classList.add("sel");
      g.addEventListener("click", function (ev) { ev.stopPropagation(); select(n.id); });
      g.addEventListener("dblclick", function (ev) {
        ev.stopPropagation();
        if (state.view === "group" && DATA.files[n.id]) enterFile(n.id);
      });
      gN.appendChild(g);
    });
    vp.appendChild(gN);

    applyTransform();
    paintPanel();
    document.getElementById("viewChip").textContent = state.view === "group"
      ? "全景 · " + DATA.groups.length + " 个子系统"
      : "文件层 · " + lay.nodes.length + " 个文件";
    document.getElementById("canvasTitle").textContent = state.view === "group" ? "仓库结构" : "文件关系";
    document.getElementById("canvasSub").textContent = state.view === "group"
      ? DATA.groups.length + " 个子系统 · " + DATA.groupEdges.length + " 条跨组依赖"
      : (lay.nodes.length + " 个文件" + (lay.dropped ? " · 另有 " + lay.dropped + " 个未画" : ""));
    var home = document.getElementById("crumb");
    home.innerHTML = state.view === "group" ? '<button id="cHome">全景</button>'
      : '<button id="cHome">全景</button> <span style="color:#4d5a6b">›</span> <button id="cGroup">'
        + cut(groupName(state.group), 24) + "</button>";
    document.getElementById("cHome").onclick = function () { state.view = "group"; state.group = null; state.sel = null; render(); fit(); };
    var cg = document.getElementById("cGroup");
    if (cg) cg.onclick = function () { state.view = "group"; state.sel = state.group; render(); };
    if (state.q) filter(state.q);
    applyHot();
  }

  function groupById(id) {
    for (var i = 0; i < DATA.groups.length; i++) if (DATA.groups[i].id === id) return DATA.groups[i];
    return null;
  }

  function groupName(id) {
    for (var i = 0; i < DATA.groups.length; i++) if (DATA.groups[i].id === id) return DATA.groups[i].label;
    return id;
  }

  function enterFile(id) {
    state.view = "file"; state.group = id; state.sel = id;
    render();
    // 文件层一屏放不下，先给一个能读字的比例，用户可再缩小
    state.scale = 0.72; state.tx = 24; state.ty = 44;
    applyTransform();
  }

  function applyTransform() {
    vp.setAttribute("transform", "translate(" + state.tx + "," + state.ty + ") scale(" + state.scale + ")");
    document.getElementById("zVal").textContent = Math.round(state.scale * 100) + "%";
  }

  function select(id) {
    state.sel = id;
    Array.prototype.forEach.call(vp.querySelectorAll(".node"), function (n) {
      n.classList.toggle("sel", n.getAttribute("data-id") === id);
    });
    applyHot();
    paintPanel();
  }

  function applyHot() {
    Array.prototype.forEach.call(vp.querySelectorAll(".edge"), function (p) {
      var hot = state.sel && (p.getAttribute("data-from") === state.sel || p.getAttribute("data-to") === state.sel);
      p.classList.toggle("hot", !!hot);
      p.setAttribute("marker-end", hot ? "url(#arwHot)" : "url(#arw)");
      if (hot) p.parentNode.appendChild(p);
    });
  }

  function paintPanel() {
    var kicker = document.getElementById("pKicker"), title = document.getElementById("pTitle"),
        path = document.getElementById("pPath"), body = document.getElementById("pBody");

    if (!state.sel) {
      kicker.textContent = "概览"; title.textContent = DATA.repo;
      path.textContent = "commit " + (DATA.commit || "unknown");
      body.innerHTML = '<div class="intro">中间的图是全仓的子系统结构：方块是顶层目录，方块之间的线是跨目录 import。双击方块进入该目录的文件层，点任意节点看右侧事实。</div>'
        + '<div class="sec">顶层目录 · ' + DATA.groups.length + "</div><ul class=\"deps\">"
        + DATA.groups.map(function (g) {
            return '<li><span style="display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:1px;background:' + (ROLE[g.role] || ROLE.other) + '"></span><b>' + g.label + "</b> <em>" + (ROLE_NAME[g.role] || "") + "</em> · " + g.files + " 文件 · " + fmt(g.symbols) + " 符号</li>";
          }).join("") + "</ul>"
        + '<div class="sec">总量</div><div class="intro">' + fmt(DATA.totals.files) + " 个文件 · "
        + fmt(DATA.totals.symbols) + " 个符号 · " + fmt(DATA.totals.imports) + " 条 import · " + DATA.degradedTotal + " 条降级</div>";
      return;
    }

    var g = groupById(state.sel);
    if (g) {
      kicker.textContent = "子系统 · " + (ROLE_NAME[g.role] || "");
      title.textContent = g.label;
      path.textContent = (g.path && g.path !== g.label) ? g.path : (g.path ? "" : "（仓库根目录）");
      var ins = DATA.groupEdges.filter(function (e) { return e.to === g.id; });
      var outs = DATA.groupEdges.filter(function (e) { return e.from === g.id; });
      var name = function (id) { var r = DATA.groups.filter(function (x) { return x.id === id; })[0]; return r ? r.label : id; };
      body.innerHTML = '<div class="facts">'
        + '<div class="fact"><b>' + g.files + '</b><span>文件</span></div>'
        + '<div class="fact"><b>' + fmt(g.symbols) + '</b><span>符号</span></div>'
        + '<div class="fact"><b>' + fmt(g.imports) + '</b><span>import</span></div>'
        + '<div class="fact"><b>' + g.degraded + '</b><span>降级</span></div></div>'
        + (g.linked ? "" : '<div class="warnbox">没有跨组依赖，所以它排在分隔线以下，不与其它目录连线。</div>')
        + '<div class="sec">目录里有什么</div><ul class="deps">' + (g.top || []).map(function (t) { return "<li>" + t + "</li>"; }).join("") + "</ul>"
        + '<div class="sec">依赖</div><ul class="deps">'
        + (outs.map(function (e) { return "<li><b>" + name(e.to) + "</b> <em>→ 被依赖</em></li>"; }).join("") || "<li>没有它依赖别人的记录</li>")
        + (ins.map(function (e) { return "<li><b>" + name(e.from) + "</b> <em>→ 依赖它</em></li>"; }).join(""))
        + "</ul>"
        + (state.view === "group"
            ? '<div class="sec">操作</div><button class="btn primary" id="enterGroup">进入文件层</button>'
            : '<div class="sec">操作</div><button class="btn" id="backGroup">返回全景</button>');
      var b = document.getElementById("enterGroup");
      if (b) b.onclick = function () { if (DATA.files[g.id]) enterFile(g.id); };
      var back = document.getElementById("backGroup");
      if (back) back.onclick = function () { state.view = "group"; state.sel = g.id; render(); fit(); };
      return;
    }

    var d = DATA.details[state.sel];
    if (!d) { kicker.textContent = "文件"; title.textContent = state.sel; path.textContent = ""; body.innerHTML = '<div class="warnbox">数据包里没有这个文件的详情。</div>'; return; }
    kicker.textContent = "文件 · " + (d.lang || "?");
    title.textContent = d.path.split("/").pop(); path.textContent = d.path;
    var dep = function (x) { return "<li>" + x.specifier + ' <em>→</em> ' + (x.target || "未解析") + "</li>"; };
    body.innerHTML = '<div class="facts">'
      + '<div class="fact"><b>' + fmt(d.lines) + '</b><span>行</span></div>'
      + '<div class="fact"><b>' + fmt(d.bytes) + '</b><span>字节</span></div>'
      + '<div class="fact"><b>' + (d.symbols || []).length + '</b><span>符号</span></div>'
      + '<div class="fact"><b>' + (d.degraded || []).length + '</b><span>降级</span></div></div>'
      + '<div class="sec">符号</div><ul class="deps">'
      + ((d.symbols || []).map(function (s) { return "<li><b>" + s.name + "</b> <em>" + s.kind + " · 第 " + s.line + " 行</em></li>"; }).join("") || "<li>无</li>") + "</ul>"
      + '<div class="sec">import</div><ul class="deps">' + ((d.imports || []).map(dep).join("") || "<li>无</li>") + "</ul>"
      + ((d.degraded && d.degraded.length) ? '<div class="sec">降级原因</div>' + d.degraded.map(function (t) { return '<div class="warnbox">' + t + "</div>"; }).join("") : "")
      + (d.snippet ? '<div class="sec">源码 · 前 80 行</div><pre class="src" id="src">' + d.snippet.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</pre>"
          + '<div style="margin-top:7px"><button class="btn" id="more">展开 / 收起</button></div>' : "")
      + '<div class="sec">操作</div><button class="btn" id="copy">复制路径</button>';
    var more = document.getElementById("more");
    if (more) more.onclick = function () { document.getElementById("src").classList.toggle("open"); };
    var copy = document.getElementById("copy");
    if (copy) copy.onclick = function () { try { navigator.clipboard.writeText(d.path); } catch (e) {} copy.textContent = "已复制"; };
  }

  function filter(q) {
    state.q = q; var hit = 0;
    Array.prototype.forEach.call(vp.querySelectorAll(".node"), function (n) {
      if (!q) { n.classList.remove("hit", "dim"); return; }
      var ok = (n.getAttribute("data-path") || "").toLowerCase().indexOf(q.toLowerCase()) >= 0;
      n.classList.toggle("hit", ok); n.classList.toggle("dim", !ok); if (ok) hit++;
    });
  }

  var drag = null;
  svg.addEventListener("mousedown", function (e) {
    if (e.target.closest(".node")) return;
    drag = { x: e.clientX - state.tx, y: e.clientY - state.ty };
    svg.classList.add("dragging");
  });
  window.addEventListener("mousemove", function (e) {
    if (!drag) return; state.tx = e.clientX - drag.x; state.ty = e.clientY - drag.y; applyTransform();
  });
  window.addEventListener("mouseup", function () { drag = null; svg.classList.remove("dragging"); });
  svg.addEventListener("wheel", function (e) {
    e.preventDefault();
    state.scale = Math.min(3, Math.max(0.25, state.scale * (e.deltaY < 0 ? 1.12 : 0.89)));
    applyTransform();
  }, { passive: false });

  function fit() {
    var lay = layer();
    if (!lay.nodes.length) return;
    var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    lay.nodes.forEach(function (n) {
      minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + lay.w); maxY = Math.max(maxY, n.y + lay.h);
    });
    var r = document.getElementById("stage").getBoundingClientRect();
    var pad = 56;
    var s = Math.min((r.width - pad * 2) / (maxX - minX), (r.height - pad * 2) / (maxY - minY), 1.1);
    s = Math.max(0.25, s);
    state.scale = s;
    state.tx = (r.width - (maxX - minX) * s) / 2 - minX * s;
    state.ty = (r.height - (maxY - minY) * s) / 2 - minY * s;
    applyTransform();
  }

  document.getElementById("zIn").onclick = function () { state.scale = Math.min(3, state.scale * 1.2); applyTransform(); };
  document.getElementById("zOut").onclick = function () { state.scale = Math.max(0.25, state.scale / 1.2); applyTransform(); };
  document.getElementById("zFit").onclick = fit;
  document.getElementById("tFit").onclick = fit;
  document.getElementById("tOverview").onclick = function () { state.view = "group"; state.group = null; render(); fit(); };
  document.getElementById("tFiles").onclick = function () {
    if (state.sel && DATA.files[state.sel]) { enterFile(state.sel); }
  };
  document.getElementById("tDegraded").onclick = function () {
    this.classList.toggle("on"); state.degraded = !state.degraded;
    Array.prototype.forEach.call(vp.querySelectorAll(".node"), function (n) {
      var has = state.view === "group" ? /降级/.test(n.textContent) : n.querySelector('rect[fill="#f2b134"]');
      n.classList.toggle("dim", state.degraded && !has);
    });
  };
  document.getElementById("tLegend").onclick = function () { this.classList.toggle("on"); };
  document.getElementById("q").addEventListener("input", function (e) { filter(e.target.value.trim()); });
  window.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "1") { state.view = "group"; state.group = null; render(); fit(); }
    if (e.key === "2" && state.sel && DATA.files[state.sel]) enterFile(state.sel);
    if (e.key === "f" || e.key === "F") fit();
    if (e.key === "Escape") { state.view = "group"; state.group = null; state.sel = null; render(); fit(); }
  });

  render(); fit();
  window.addEventListener("resize", fit);
})();
</script>
</body>
</html>
