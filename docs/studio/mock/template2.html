<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>笺疏 Studio · __REPO__</title>
<style>__CSS__</style>
</head>
<body>
<div class="top">
  <div class="brand"><b>笺疏 Studio</b><span>__REPO__</span></div>
  <div class="stats">
    <div class="stat"><b>__FILES__</b><span>文件</span></div>
    <div class="stat"><b>__SYMBOLS__</b><span>符号</span></div>
    <div class="stat"><b>__IMPORTS__</b><span>import</span></div>
    <div class="stat"><b>__DEGRADED__</b><span>降级</span></div>
  </div>
  <div class="spacer"></div>
  <div class="chip" id="viewChip">全景</div>
  <div class="chip warn">__COMMIT__</div>
</div>

<div class="body">
  <div class="rail">
    <button class="tool on" id="tOverview"><span class="tip">全景（1）</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="7" height="7"/><rect x="13.5" y="3.5" width="7" height="7"/><rect x="3.5" y="13.5" width="7" height="7"/><rect x="13.5" y="13.5" width="7" height="7"/></svg></button>
    <button class="tool" id="tFiles"><span class="tip">文件层（2，先选一个子系统）</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3.5h8l4 4v13H5z"/><path d="M13 3.5v4h4"/></svg></button>
    <div class="sep"></div>
    <button class="tool" id="tDegraded"><span class="tip">只看有降级的节点</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.6"/></svg></button>
    <button class="tool" id="tFit"><span class="tip">适应画布（F）</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <div class="sep"></div>
    <button class="tool" id="tLegend"><span class="tip">图例</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h10M4 18h13"/></svg></button>
  </div>

  <div class="stage" id="stage">
    <div class="canvas-head"><b id="canvasTitle">仓库结构</b><span id="canvasSub"></span></div>
    <svg class="graph" id="graph" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arw" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#3a4757"/></marker>
        <marker id="arwHot" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#5b9cf6"/></marker>
      </defs>
      <g id="viewport"></g>
    </svg>
    <div class="legend">
      <span><i></i>跨组依赖</span><span><i class="cyc"></i>双向 / 循环</span><span><i class="hot"></i>选中</span>
    </div>
    <div class="hud">
      <button id="zOut">−</button><div class="zoom" id="zVal">100%</div><button id="zIn">+</button>
      <button id="zFit" title="适应画布"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>

  <aside class="panel">
    <header>
      <div class="kicker" id="pKicker">概览</div>
      <h1 id="pTitle">__REPO__</h1>
      <div class="p" id="pPath">点一个方块看详情 · 双击进入文件层</div>
    </header>
    <div class="scroll" id="pBody"></div>
  </aside>
</div>

<div class="foot">
  <div class="crumb" id="crumb"><button id="cHome">全景</button></div>
  <div style="color:#5d6a7b">点击选中 · 双击下钻 · 拖动平移 · 滚轮缩放 · 1/2 切层 · f 适应</div>
  <div class="search">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5d6a7b" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" placeholder="搜文件 / 目录">
  </div>
</div>

<script>
var DATA = __DATA__;
(function () {
  var svg = document.getElementById("graph"), vp = document.getElementById("viewport");
  var state = { view: "group", group: null, sel: null, scale: 1, tx: 0, ty: 0, q: "", hot: [] };
  var CW = 320, CH = 152, FW = 300, FH = 54;
  var ROLE = { code: "#5b9cf6", test: "#48b78f", config: "#f2b134", docs: "#8a94a6", data: "#b07cf0", other: "#7d8b9e" };
  var ROLE_NAME = { code: "代码", test: "测试", config: "配置", docs: "文档", data: "数据", other: "其它" };

  function el(name, attrs, text) {
    var n = document.createElementNS("http://www.w3.org/2000/svg", name);
    for (var k in attrs) { if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]); }
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function cut(s, n) { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
  function fmt(n) { return (n === null || n === undefined) ? "—" : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  function layer() {
    if (state.view === "group") return { nodes: DATA.groups, edges: DATA.groupEdges, w: CW, h: CH };
    var g = DATA.files[state.group] || { nodes: [], edges: [] };
    return { nodes: g.nodes, edges: g.edges, w: FW, h: FH, dropped: g.dropped || 0 };
  }

  function edgePath(a, b, w, h, dir) {
    if (b.x <= a.x) {
      // 回边：从下方绕回来，不穿过卡片
      var ax = a.x + w * 0.7, bx = b.x + w * 0.3;
      var ry = Math.max(a.y + h, b.y + h) + 52 + (dir < 0 ? 26 : 0);
      return "M" + ax + " " + (a.y + h) + " C" + ax + " " + ry + " " + bx + " " + ry + " " + bx + " " + (b.y + h);
    }
    // 正向：左右邻居在同一个水平带上，直接一条带弧度的横线，两个方向上下分开
    var y1 = a.y + h / 2 + dir * 20, y2 = b.y + h / 2 + dir * 20;
    var mx = (a.x + w + b.x) / 2;
    return "M" + (a.x + w) + " " + y1 + " C" + mx + " " + y1 + " " + mx + " " + y2 + " " + b.x + " " + y2;
  }

  function edgeLabelPos(a, b, w, h, dir) {
    if (b.x <= a.x) return [(a.x + w * 0.7 + b.x + w * 0.3) / 2, Math.max(a.y + h, b.y + h) + 44];
    return [(a.x + w + b.x) / 2, a.y + h / 2 + dir * 20 - 8];
  }

  function drawGroup(n, w, h) {
    var g = el("g", { class: "node", "data-id": n.id, "data-path": (n.path || n.label), transform: "translate(" + n.x + "," + n.y + ")" });
    g.appendChild(el("rect", { class: "card", x: 0, y: 0, width: w, height: h, rx: 2 }));
    g.appendChild(el("rect", { class: "accent", x: 0, y: 0, width: 3, height: h, fill: ROLE[n.role] || ROLE.other }));
    g.appendChild(el("text", { class: "title", x: 16, y: 29 }, cut(n.label, 22)));
    var dom = n.dominant && n.dominant[0] ? fmt(n.dominant[1]) + " 个 " + n.dominant[0] + " 文件" : "多种扩展名混在一起";
    g.appendChild(el("text", { class: "path", x: 16, y: 47 }, cut(dom, 34)));
    (n.top || []).slice(0, 3).forEach(function (t, i) {
      g.appendChild(el("text", { class: "item", x: 16, y: 68 + i * 18 }, "· " + cut(t, 34)));
    });
    g.appendChild(el("rect", { class: "rule", x: 0, y: h - 30, width: w, height: 1 }));
    g.appendChild(el("text", { class: "count", x: 16, y: h - 11 }, n.files + " 文件"));
    g.appendChild(el("text", { class: "meta", x: 112, y: h - 11 }, fmt(n.symbols) + " 符号"));
    if (n.degraded) g.appendChild(el("text", { class: "meta", x: 212, y: h - 11, fill: "#f2b134" }, n.degraded + " 降级"));
    return g;
  }

  function drawFile(n, w, h) {
    var g = el("g", { class: "node", "data-id": n.id, "data-path": n.path, transform: "translate(" + n.x + "," + n.y + ")" });
    g.appendChild(el("rect", { class: "card", x: 0, y: 0, width: w, height: h, rx: 2 }));
    g.appendChild(el("rect", { class: "accent", x: 0, y: 0, width: 2.5, height: h, fill: n.degraded ? "#f2b134" : "#5b9cf6" }));
    g.appendChild(el("text", { class: "fname", x: 14, y: 23 }, cut(n.label, 26)));
    g.appendChild(el("text", { class: "fmeta", x: 14, y: 41 }, (n.lang || "?") + " · " + fmt(n.lines) + " 行 · " + n.symbols + " 符号"
      + (n.degraded ? " · " + n.degraded + " 降级" : "")));
    return g;
  }

  function render() {
    vp.textContent = "";
    var lay = layer(), byId = {};
    lay.nodes.forEach(function (n) { byId[n.id] = n; });

    if (state.view === "group" && DATA.linkedCount) {
      var gy = DATA.gridTop - 74;
      var maxR = 0; DATA.groups.forEach(function (n) { maxR = Math.max(maxR, n.x + CW); });
      vp.appendChild(el("line", { class: "divider", x1: 40, y1: gy, x2: maxR, y2: gy }));
      vp.appendChild(el("text", { class: "band-label", x: 44, y: gy + 20 }, "以下 " + (DATA.groups.length - DATA.linkedCount) + " 个目录与任何目录都没有跨组依赖"));
    }

    var gE = el("g", {});
    var seen = {};
    lay.edges.forEach(function (e) {
      var a = byId[e.from], b = byId[e.to];
      if (!a || !b) return;
      var back = state.view === "group" && byId[e.to] && (e.to + "|" + e.from) in seen && seen[e.from + "|" + e.to] === 1;
      var dir = 0;
      if (state.view === "group") {
        var pair = (e.from < e.to) ? 1 : -1;
        dir = pair;
      }
      seen[e.from + "|" + e.to] = 1;
      var cyc = state.view === "group" && b.x <= a.x;
      var p = el("path", { class: "edge" + (cyc ? " cyc" : "") + (state.view === "file" ? " faint" : ""), d: edgePath(a, b, lay.w, lay.h, dir), "marker-end": "url(#arw)" });
      p.setAttribute("data-from", e.from); p.setAttribute("data-to", e.to);
      gE.appendChild(p);
      if (e.count > 1) {
        var lp = edgeLabelPos(a, b, lay.w, lay.h, dir);
        gE.appendChild(el("text", { class: "edge-label", x: lp[0] - 12, y: lp[1] }, "×" + e.count + " 次"));
      } else if (state.view === "group") {
        var lp2 = edgeLabelPos(a, b, lay.w, lay.h, dir);
        gE.appendChild(el("text", { class: "edge-label", x: lp2[0] - 10, y: lp2[1] }, e.label || ""));
      }
    });
    vp.appendChild(gE);

    var gN = el("g", {});
    lay.nodes.forEach(function (n) {
      if (n.kind === "dir") {
        var dg = el("g", { class: "dirnode", transform: "translate(" + n.x + "," + n.y + ")" });
        dg.appendChild(el("text", { class: "dirlabel", x: 0, y: 0 }, n.label));
        dg.appendChild(el("text", { class: "dircount", x: 4 + n.label.length * 7.2, y: 0 }, n.files + " 文件"));
        gN.appendChild(dg);
        return;
      }
      var g = state.view === "group" ? drawGroup(n, lay.w, lay.h) : drawFile(n, lay.w, lay.h);
      if (n.id === state.sel) g.classList.add("sel");
      g.addEventListener("click", function (ev) { ev.stopPropagation(); select(n.id); });
      g.addEventListener("dblclick", function (ev) {
        ev.stopPropagation();
        if (state.view === "group" && DATA.files[n.id]) enterFile(n.id);
      });
      gN.appendChild(g);
    });
    vp.appendChild(gN);

    applyTransform();
    paintPanel();
    document.getElementById("viewChip").textContent = state.view === "group"
      ? "全景 · " + DATA.groups.length + " 个子系统"
      : "文件层 · " + lay.nodes.length + " 个文件";
    document.getElementById("canvasTitle").textContent = state.view === "group" ? "仓库结构" : "文件关系";
    document.getElementById("canvasSub").textContent = state.view === "group"
      ? DATA.groups.length + " 个子系统 · " + DATA.groupEdges.length + " 条跨组依赖"
      : (lay.nodes.length + " 个文件" + (lay.dropped ? " · 另有 " + lay.dropped + " 个未画" : ""));
    var home = document.getElementById("crumb");
    home.innerHTML = state.view === "group" ? '<button id="cHome">全景</button>'
      : '<button id="cHome">全景</button> <span style="color:#4d5a6b">›</span> <button id="cGroup">'
        + cut(groupName(state.group), 24) + "</button>";
    document.getElementById("cHome").onclick = function () { state.view = "group"; state.group = null; state.sel = null; render(); fit(); };
    var cg = document.getElementById("cGroup");
    if (cg) cg.onclick = function () { state.view = "group"; state.sel = state.group; render(); };
    if (state.q) filter(state.q);
    applyHot();
  }

  function groupById(id) {
    for (var i = 0; i < DATA.groups.length; i++) if (DATA.groups[i].id === id) return DATA.groups[i];
    return null;
  }

  function groupName(id) {
    for (var i = 0; i < DATA.groups.length; i++) if (DATA.groups[i].id === id) return DATA.groups[i].label;
    return id;
  }

  function enterFile(id) {
    state.view = "file"; state.group = id; state.sel = id;
    render();
    // 文件层一屏放不下，先给一个能读字的比例，用户可再缩小
    state.scale = 0.72; state.tx = 24; state.ty = 44;
    applyTransform();
  }

  function applyTransform() {
    vp.setAttribute("transform", "translate(" + state.tx + "," + state.ty + ") scale(" + state.scale + ")");
    document.getElementById("zVal").textContent = Math.round(state.scale * 100) + "%";
  }

  function select(id) {
    state.sel = id;
    Array.prototype.forEach.call(vp.querySelectorAll(".node"), function (n) {
      n.classList.toggle("sel", n.getAttribute("data-id") === id);
    });
    applyHot();
    paintPanel();
  }

  function applyHot() {
    Array.prototype.forEach.call(vp.querySelectorAll(".edge"), function (p) {
      var hot = state.sel && (p.getAttribute("data-from") === state.sel || p.getAttribute("data-to") === state.sel);
      p.classList.toggle("hot", !!hot);
      p.setAttribute("marker-end", hot ? "url(#arwHot)" : "url(#arw)");
      if (hot) p.parentNode.appendChild(p);
    });
  }

  function paintPanel() {
    var kicker = document.getElementById("pKicker"), title = document.getElementById("pTitle"),
        path = document.getElementById("pPath"), body = document.getElementById("pBody");

    if (!state.sel) {
      kicker.textContent = "概览"; title.textContent = DATA.repo;
      path.textContent = "commit " + (DATA.commit || "unknown");
      body.innerHTML = '<div class="intro">中间的图是全仓的子系统结构：方块是顶层目录，方块之间的线是跨目录 import。双击方块进入该目录的文件层，点任意节点看右侧事实。</div>'
        + '<div class="sec">顶层目录 · ' + DATA.groups.length + "</div><ul class=\"deps\">"
        + DATA.groups.map(function (g) {
            return '<li><span style="display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:1px;background:' + (ROLE[g.role] || ROLE.other) + '"></span><b>' + g.label + "</b> <em>" + (ROLE_NAME[g.role] || "") + "</em> · " + g.files + " 文件 · " + fmt(g.symbols) + " 符号</li>";
          }).join("") + "</ul>"
        + '<div class="sec">总量</div><div class="intro">' + fmt(DATA.totals.files) + " 个文件 · "
        + fmt(DATA.totals.symbols) + " 个符号 · " + fmt(DATA.totals.imports) + " 条 import · " + DATA.degradedTotal + " 条降级</div>";
      return;
    }

    var g = groupById(state.sel);
    if (g) {
      kicker.textContent = "子系统 · " + (ROLE_NAME[g.role] || "");
      title.textContent = g.label;
      path.textContent = (g.path && g.path !== g.label) ? g.path : (g.path ? "" : "（仓库根目录）");
      var ins = DATA.groupEdges.filter(function (e) { return e.to === g.id; });
      var outs = DATA.groupEdges.filter(function (e) { return e.from === g.id; });
      var name = function (id) { var r = DATA.groups.filter(function (x) { return x.id === id; })[0]; return r ? r.label : id; };
      body.innerHTML = '<div class="facts">'
        + '<div class="fact"><b>' + g.files + '</b><span>文件</span></div>'
        + '<div class="fact"><b>' + fmt(g.symbols) + '</b><span>符号</span></div>'
        + '<div class="fact"><b>' + fmt(g.imports) + '</b><span>import</span></div>'
        + '<div class="fact"><b>' + g.degraded + '</b><span>降级</span></div></div>'
        + (g.linked ? "" : '<div class="warnbox">没有跨组依赖，所以它排在分隔线以下，不与其它目录连线。</div>')
        + '<div class="sec">目录里有什么</div><ul class="deps">' + (g.top || []).map(function (t) { return "<li>" + t + "</li>"; }).join("") + "</ul>"
        + '<div class="sec">依赖</div><ul class="deps">'
        + (outs.map(function (e) { return "<li><b>" + name(e.to) + "</b> <em>→ 被依赖</em></li>"; }).join("") || "<li>没有它依赖别人的记录</li>")
        + (ins.map(function (e) { return "<li><b>" + name(e.from) + "</b> <em>→ 依赖它</em></li>"; }).join(""))
        + "</ul>"
        + (state.view === "group"
            ? '<div class="sec">操作</div><button class="btn primary" id="enterGroup">进入文件层</button>'
            : '<div class="sec">操作</div><button class="btn" id="backGroup">返回全景</button>');
      var b = document.getElementById("enterGroup");
      if (b) b.onclick = function () { if (DATA.files[g.id]) enterFile(g.id); };
      var back = document.getElementById("backGroup");
      if (back) back.onclick = function () { state.view = "group"; state.sel = g.id; render(); fit(); };
      return;
    }

    var d = DATA.details[state.sel];
    if (!d) { kicker.textContent = "文件"; title.textContent = state.sel; path.textContent = ""; body.innerHTML = '<div class="warnbox">数据包里没有这个文件的详情。</div>'; return; }
    kicker.textContent = "文件 · " + (d.lang || "?");
    title.textContent = d.path.split("/").pop(); path.textContent = d.path;
    var dep = function (x) { return "<li>" + x.specifier + ' <em>→</em> ' + (x.target || "未解析") + "</li>"; };
    body.innerHTML = '<div class="facts">'
      + '<div class="fact"><b>' + fmt(d.lines) + '</b><span>行</span></div>'
      + '<div class="fact"><b>' + fmt(d.bytes) + '</b><span>字节</span></div>'
      + '<div class="fact"><b>' + (d.symbols || []).length + '</b><span>符号</span></div>'
      + '<div class="fact"><b>' + (d.degraded || []).length + '</b><span>降级</span></div></div>'
      + '<div class="sec">符号</div><ul class="deps">'
      + ((d.symbols || []).map(function (s) { return "<li><b>" + s.name + "</b> <em>" + s.kind + " · 第 " + s.line + " 行</em></li>"; }).join("") || "<li>无</li>") + "</ul>"
      + '<div class="sec">import</div><ul class="deps">' + ((d.imports || []).map(dep).join("") || "<li>无</li>") + "</ul>"
      + ((d.degraded && d.degraded.length) ? '<div class="sec">降级原因</div>' + d.degraded.map(function (t) { return '<div class="warnbox">' + t + "</div>"; }).join("") : "")
      + (d.snippet ? '<div class="sec">源码 · 前 80 行</div><pre class="src" id="src">' + d.snippet.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</pre>"
          + '<div style="margin-top:7px"><button class="btn" id="more">展开 / 收起</button></div>' : "")
      + '<div class="sec">操作</div><button class="btn" id="copy">复制路径</button>';
    var more = document.getElementById("more");
    if (more) more.onclick = function () { document.getElementById("src").classList.toggle("open"); };
    var copy = document.getElementById("copy");
    if (copy) copy.onclick = function () { try { navigator.clipboard.writeText(d.path); } catch (e) {} copy.textContent = "已复制"; };
  }

  function filter(q) {
    state.q = q; var hit = 0;
    Array.prototype.forEach.call(vp.querySelectorAll(".node"), function (n) {
      if (!q) { n.classList.remove("hit", "dim"); return; }
      var ok = (n.getAttribute("data-path") || "").toLowerCase().indexOf(q.toLowerCase()) >= 0;
      n.classList.toggle("hit", ok); n.classList.toggle("dim", !ok); if (ok) hit++;
    });
  }

  var drag = null;
  svg.addEventListener("mousedown", function (e) {
    if (e.target.closest(".node")) return;
    drag = { x: e.clientX - state.tx, y: e.clientY - state.ty };
    svg.classList.add("dragging");
  });
  window.addEventListener("mousemove", function (e) {
    if (!drag) return; state.tx = e.clientX - drag.x; state.ty = e.clientY - drag.y; applyTransform();
  });
  window.addEventListener("mouseup", function () { drag = null; svg.classList.remove("dragging"); });
  svg.addEventListener("wheel", function (e) {
    e.preventDefault();
    state.scale = Math.min(3, Math.max(0.25, state.scale * (e.deltaY < 0 ? 1.12 : 0.89)));
    applyTransform();
  }, { passive: false });

  function fit() {
    var lay = layer();
    if (!lay.nodes.length) return;
    var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    lay.nodes.forEach(function (n) {
      minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + lay.w); maxY = Math.max(maxY, n.y + lay.h);
    });
    var r = document.getElementById("stage").getBoundingClientRect();
    var pad = 56;
    var s = Math.min((r.width - pad * 2) / (maxX - minX), (r.height - pad * 2) / (maxY - minY), 1.1);
    s = Math.max(0.25, s);
    state.scale = s;
    state.tx = (r.width - (maxX - minX) * s) / 2 - minX * s;
    state.ty = (r.height - (maxY - minY) * s) / 2 - minY * s;
    applyTransform();
  }

  document.getElementById("zIn").onclick = function () { state.scale = Math.min(3, state.scale * 1.2); applyTransform(); };
  document.getElementById("zOut").onclick = function () { state.scale = Math.max(0.25, state.scale / 1.2); applyTransform(); };
  document.getElementById("zFit").onclick = fit;
  document.getElementById("tFit").onclick = fit;
  document.getElementById("tOverview").onclick = function () { state.view = "group"; state.group = null; render(); fit(); };
  document.getElementById("tFiles").onclick = function () {
    if (state.sel && DATA.files[state.sel]) { enterFile(state.sel); }
  };
  document.getElementById("tDegraded").onclick = function () {
    this.classList.toggle("on"); state.degraded = !state.degraded;
    Array.prototype.forEach.call(vp.querySelectorAll(".node"), function (n) {
      var has = state.view === "group" ? /降级/.test(n.textContent) : n.querySelector('rect[fill="#f2b134"]');
      n.classList.toggle("dim", state.degraded && !has);
    });
  };
  document.getElementById("tLegend").onclick = function () { this.classList.toggle("on"); };
  document.getElementById("q").addEventListener("input", function (e) { filter(e.target.value.trim()); });
  window.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "1") { state.view = "group"; state.group = null; render(); fit(); }
    if (e.key === "2" && state.sel && DATA.files[state.sel]) enterFile(state.sel);
    if (e.key === "f" || e.key === "F") fit();
    if (e.key === "Escape") { state.view = "group"; state.group = null; state.sel = null; render(); fit(); }
  });

  render(); fit();
  window.addEventListener("resize", fit);
})();
</script>
</body>
</html>
