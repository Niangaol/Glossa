<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>笺疏 Studio · safetrace</title>
<style>
  /* ============================================================
     笺疏 Studio · 纸质主题（paper）
     视觉语言：案头纸稿 / 朱笔标流向 / 墨线画依赖 / 铅笔淡格
     ============================================================ */
  :root {
    color-scheme: dark;
    /* —— 夜读：暖炭纸（不用纯黑，纸在灯下是暖的）—— */
    --bg: #17140f; --panel: #1d1a14; --panel-2: #24201a;
    --line: #362f25; --line-soft: #2a251d;
    --ink: #e9dfc9; --ink-2: #b4a88d; --ink-3: #8a7f68;
    --paper: #221e17; --paper-hi: #282319;
    --azure: #7f9cc4;   /* 墨蓝：import 依赖 */
    --flow: #d4745c;    /* 朱砂：数据流 */
    --amber: #c99a4e; --mint: #6f9c7e; --rose: #c2685e;
    --seal: #b8402f;
    --grid: #241f18;
    --card: var(--paper); --card-hover: #2a251c;
    --sheet: 0 1px 0 rgba(255, 240, 210, .05), 0 10px 24px -14px rgba(0, 0, 0, .8);
    --shadow: 0 1px 0 rgba(255, 240, 210, .05), 0 8px 22px rgba(0, 0, 0, .5);
    --grain: .44;
    --tint-code: #221e17; --tint-test: #1e2420; --tint-config: #262219; --tint-docs: #22211c; --tint-data: #231f27; --tint-other: #211e17;
    --mono: ui-monospace, "Cascadia Code", Consolas, "SF Mono", monospace;
    --sans: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", Georgia, serif;
    --ease: cubic-bezier(.2, .7, .3, 1);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      /* —— 日读：米白稿纸 + 墨 + 朱砂 —— */
      --bg: #efe7d6; --panel: #f8f2e3; --panel-2: #ece2ce;
      --line: #d6c8ae; --line-soft: #e2d7c1;
      --ink: #2c2823; --ink-2: #5b5344; --ink-3: #8d8067;
      --paper: #fbf6e8; --paper-hi: #fffdf4;
      --azure: #3f5f8a; --flow: #b0402f;
      --amber: #a8762a; --mint: #4a7a5f; --rose: #a8443c;
      --seal: #b8402f;
      --grid: #e6dbc4;
      --card: var(--paper); --card-hover: #fffdf6;
      --sheet: 0 1px 0 rgba(255, 255, 255, .9), 0 10px 22px -16px rgba(90, 70, 40, .55);
      --shadow: 0 1px 0 rgba(255, 255, 255, .9), 0 6px 18px rgba(90, 70, 40, .16);
      --grain: .50;
      --tint-code: #fbf6e8; --tint-test: #f1f5ea; --tint-config: #faf1dd; --tint-docs: #f6f3e5; --tint-data: #f4eff6; --tint-other: #f8f3e4;
    }
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #efe7d6; --panel: #f8f2e3; --panel-2: #ece2ce;
    --line: #d6c8ae; --line-soft: #e2d7c1;
    --ink: #2c2823; --ink-2: #5b5344; --ink-3: #8d8067;
    --paper: #fbf6e8; --paper-hi: #fffdf4;
    --azure: #3f5f8a; --flow: #b0402f;
    --amber: #a8762a; --mint: #4a7a5f; --rose: #a8443c;
    --seal: #b8402f;
    --grid: #e6dbc4;
    --card: var(--paper); --card-hover: #fffdf6;
    --sheet: 0 1px 0 rgba(255, 255, 255, .9), 0 10px 22px -16px rgba(90, 70, 40, .55);
    --shadow: 0 1px 0 rgba(255, 255, 255, .9), 0 6px 18px rgba(90, 70, 40, .16);
    --grain: .50;
    --tint-code: #fbf6e8; --tint-test: #f1f5ea; --tint-config: #faf1dd; --tint-docs: #f6f3e5; --tint-data: #f4eff6; --tint-other: #f8f3e4;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font: 13px/1.6 var(--sans);
    display: grid; grid-template-rows: 52px 1fr 32px; overflow: hidden;
    transition: background .25s var(--ease), color .25s var(--ease);
  }
  /* 纸纤维：整页极淡的斜向纤维，避免大面积纯色显塑料 */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 99;
    background-image:
      repeating-linear-gradient(94deg, rgba(0,0,0,.016) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(-87deg, rgba(255,255,255,.026) 0 1px, transparent 1px 6px),
      repeating-linear-gradient(2deg, rgba(0,0,0,.010) 0 1px, transparent 1px 13px);
    mix-blend-mode: multiply; opacity: .9;
  }

  /* ---------------- 顶栏：稿纸上的一条抬头 ---------------- */
  .top { display: flex; align-items: center; gap: 16px; padding: 0 18px;
    border-bottom: 1px solid var(--line); background: var(--panel); position: relative; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand::before {
    content: "笺"; display: grid; place-items: center;
    width: 26px; height: 26px; border-radius: 2px;
    background: var(--seal); color: #fbeee2;
    font: 600 15px/1 var(--serif); letter-spacing: 0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.35), 0 1px 2px rgba(0,0,0,.25);
    transform: rotate(-2.5deg);
  }
  .brand b { font: 600 16px/1 var(--serif); letter-spacing: .06em; }
  .brand span { color: var(--ink-3); font: 10px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; }
  .stats { display: flex; gap: 20px; margin-left: 12px; padding-left: 20px; border-left: 1px solid var(--line-soft); }
  .stat b { font: 600 13px/1 var(--mono); font-variant-numeric: tabular-nums; }
  .stat span { font: 11px/1 var(--sans); color: var(--ink-3); margin-left: 5px; }
  .spacer { flex: 1; }
  .chip { border: 1px solid var(--line); border-radius: 2px; padding: 4px 9px;
    font: 11px/1.3 var(--mono); color: var(--ink-2); background: var(--panel-2); }
  .chip.warn { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 38%, transparent); }
  .iconbtn { width: 30px; height: 30px; display: grid; place-items: center; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-2); border-radius: 2px; }
  .iconbtn:hover { color: var(--ink); border-color: var(--ink-3); }

  /* ---------------- 三栏 ---------------- */
  .body { display: grid; grid-template-columns: 56px 1fr 348px; min-height: 0; }
  .rail { border-right: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0; }
  .tool { width: 40px; height: 40px; display: grid; place-items: center; position: relative;
    border: 1px solid transparent; border-radius: 2px; color: var(--ink-2); background: none; cursor: pointer;
    transition: color .16s var(--ease), background .16s var(--ease), border-color .16s var(--ease); }
  .tool:hover { color: var(--ink); background: var(--panel-2); }
  .tool.on { color: var(--flow); border-color: color-mix(in srgb, var(--flow) 34%, var(--line));
    background: color-mix(in srgb, var(--flow) 9%, transparent); }
  .tool svg { width: 18px; height: 18px; }
  .tool .tip { position: absolute; left: 50px; top: 9px; white-space: nowrap; display: none;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    font: 11px/1 var(--sans); padding: 6px 8px; border-radius: 2px; z-index: 9; box-shadow: var(--shadow); }
  .tool:hover .tip { display: block; }
  .rail .sep { width: 22px; height: 1px; background: var(--line); margin: 7px 0; }

  /* ---------------- 画布：一张有纤维的纸 ---------------- */
  .stage { position: relative; min-width: 0; overflow: hidden;
    background-color: var(--bg);
    background-image:
      linear-gradient(to right, color-mix(in srgb, var(--grid) 62%, transparent) 1px, transparent 1px),
      linear-gradient(to bottom, color-mix(in srgb, var(--grid) 62%, transparent) 1px, transparent 1px),
      radial-gradient(120% 90% at 50% -10%, color-mix(in srgb, var(--paper-hi) 30%, transparent), transparent 70%);
    background-size: 24px 24px, 24px 24px, 100% 100%;
    transition: background-color .25s var(--ease);
    box-shadow: inset 0 0 140px -50px rgba(70, 52, 30, .40); }
  /* 颗粒：叠在整张纸上（含卡片），看起来才像同一张纸的凹凸 */
  .stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
    opacity: var(--grain); mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23g)' opacity='0.5'/></svg>");
  }
  svg.graph { width: 100%; height: 100%; display: block; cursor: grab; position: relative; z-index: 1; }
  svg.graph.dragging { cursor: grabbing; }
  #viewport { transition: transform .3s var(--ease); }
  #viewport.nofx { transition: none; }

  .canvas-head { position: absolute; left: 0; top: 0; padding: 12px 40px 10px 18px; pointer-events: none; z-index: 4;
    background: linear-gradient(90deg, color-mix(in srgb, var(--bg) 94%, transparent) 60%, transparent); }
  .canvas-head b { font: 600 12.5px/1 var(--serif); color: var(--ink-2); letter-spacing: .03em; }
  .canvas-head span { font: 10.5px/1 var(--mono); color: var(--ink-3); margin-left: 8px; }

  /* ---------------- 边：铅笔 / 朱笔 ---------------- */
  .edge { fill: none; stroke-linecap: round;
    transition: opacity .18s var(--ease), stroke-opacity .18s var(--ease); }
  .edge.glow { filter: blur(2.2px); }
  .edge.dep { stroke: var(--azure); stroke-opacity: .30; stroke-dasharray: 7 6; stroke-width: 1.1px;
    animation: flow 2.2s linear infinite; }
  .edge.dep.glow { stroke-opacity: .08; }
  .edge.dat { stroke: var(--flow); stroke-opacity: .95; stroke-width: 2.4px; }
  .edge.dat.glow { stroke-opacity: .16; }
  .edge.live { stroke-opacity: 1; stroke-dasharray: 10 6; animation-duration: .9s; }
  .edge.dim { stroke-opacity: .08; }
  .packet.dep { fill: var(--azure); opacity: .8; }
  .packet.dat { fill: var(--flow); filter: drop-shadow(0 0 4px color-mix(in srgb, var(--flow) 55%, transparent)); }
  .node.loose .card { stroke-dasharray: 4 4; stroke-opacity: .75; }
  .node.loose { opacity: .86; }
  .edge-label.dat { fill: var(--flow); }
  .arrowtip { stroke: none; pointer-events: none; }
  .arrowtip.dat { fill: var(--flow); stroke: var(--card); stroke-width: 1.1px;
    filter: drop-shadow(0 1px 1px rgba(60, 40, 20, .35)); }
  .arrowtip.dep { fill: var(--azure); opacity: .45; }
  .arrowtip.live { opacity: 1; }
  .edge-label { font: 600 10px/1 var(--mono); fill: var(--ink-2);
    paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }

  /* ---------------- 节点：一张张纸卡 ---------------- */
  .band-label { font: 10.5px/1 var(--mono); fill: var(--ink-3); letter-spacing: .1em; }
  .divider { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 6; }
  .node { cursor: pointer; animation: nodeIn .42s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 26ms); }
  @keyframes nodeIn { from { opacity: 0; transform: translateY(9px) rotate(-.2deg); } }
  g.node[data-role="code"] rect.card { fill: var(--tint-code); }
  g.node[data-role="test"] rect.card { fill: var(--tint-test); }
  g.node[data-role="config"] rect.card { fill: var(--tint-config); }
  g.node[data-role="docs"] rect.card { fill: var(--tint-docs); }
  g.node[data-role="data"] rect.card { fill: var(--tint-data); }
  g.node[data-role="other"] rect.card, g.node[data-role="degraded"] rect.card { fill: var(--tint-other); }
  .node rect.accent { opacity: .82; }
  .node rect.sheet { fill: color-mix(in srgb, var(--bg) 86%, var(--ink));
    stroke: color-mix(in srgb, var(--ink) 16%, transparent); stroke-width: 1; opacity: .9; }
  .node rect.card { fill: var(--card); stroke: color-mix(in srgb, var(--ink) 30%, transparent); stroke-width: 1;
    transition: fill .18s var(--ease), stroke .18s var(--ease), filter .18s var(--ease); }
  .node rect.card { filter: drop-shadow(0 1px 1px rgba(60, 45, 25, .18)) drop-shadow(0 8px 14px rgba(60, 45, 25, .12)); }
  .node:hover rect.card { fill: var(--card-hover);
    stroke: color-mix(in srgb, var(--flow) 45%, transparent);
    filter: drop-shadow(0 2px 2px rgba(60, 45, 25, .2)) drop-shadow(0 12px 20px rgba(60, 45, 25, .18)); }
  .node.sel rect.card { stroke: var(--flow); stroke-width: 1.6; }
  .node.sel rect.pulse { animation: pulse 1.9s ease-out infinite; }
  @keyframes pulse { 0% { opacity: .5; rx: 2; } 70% { opacity: 0; rx: 9; } 100% { opacity: 0; } }
  .node.hit rect.card { stroke: var(--amber); stroke-width: 2; }
  .node.dim { opacity: .18; }
  .node text.title { font: 600 14.5px/1 var(--serif); fill: var(--ink); letter-spacing: .01em; }
  .node text.path, .node text.fmeta { font: 10.5px/1 var(--mono); fill: var(--ink-3); }
  .node text.item { font: 11px/1 var(--mono); fill: var(--ink-2); }
  .node text.meta { font: 10.5px/1 var(--mono); fill: var(--ink-3); }
  .node text.count { font: 600 11px/1 var(--mono); fill: var(--ink-2); }
  .node text.fname { font: 600 13px/1 var(--serif); fill: var(--ink); }
  .node rect.rule { fill: color-mix(in srgb, var(--ink) 16%, transparent); }
  .sum { font: 11px/1.45 var(--sans); fill: var(--ink-2); }
  .fdir { font: 10.5px/1 var(--mono); fill: var(--ink-3); }
  .fsum { font: 10.5px/1.45 var(--sans); fill: var(--ink-3); }
  .dirlabel { font: 600 12px/1 var(--serif); fill: var(--ink-2); }
  .dircount { font: 10.5px/1 var(--mono); fill: var(--ink-3); }

  /* ---------------- 朱批：选中时的划线 + 盖印 ---------------- */
  .node path.annot { fill: none; stroke: var(--flow); stroke-width: 2.1px; stroke-linecap: round;
    stroke-opacity: .9; filter: drop-shadow(0 1px 0 rgba(255, 250, 235, .30));
    transition: stroke-dashoffset .34s cubic-bezier(.2, .7, .3, 1); }
  .node g.stamp { transform-box: fill-box; transform-origin: 50% 50%;
    animation: stampIn .5s cubic-bezier(.15, .9, .2, 1.25) both;
    filter: drop-shadow(0 1px 1px rgba(90, 40, 25, .28)); }
  .node g.stamp rect { fill: color-mix(in srgb, var(--seal) 88%, transparent);
    stroke: color-mix(in srgb, var(--seal) 62%, transparent); stroke-width: .8; }
  .node g.stamp text { font: 600 15px/1 var(--serif); fill: #fbeee2; text-anchor: middle; }
  @keyframes stampIn {
    0%   { opacity: 0;  transform: scale(1.9) rotate(-17deg); }
    58%  { opacity: .97; transform: scale(.92) rotate(-6deg); }
    100% { opacity: .9;  transform: scale(1) rotate(-8deg); }
  }

  /* ---------------- 档案卡索引条（只在系统层出现） ---------------- */
  .index-strip { position: absolute; right: 10px; top: 58px; bottom: 56px; z-index: 4;
    display: flex; flex-direction: column; align-items: flex-end; gap: 3px; overflow: visible; }
  .index-strip .tab { flex: 0 0 auto; display: flex; align-items: center; gap: 5px; width: 29px; height: 25px;
    padding: 0 3px; border: 1px solid color-mix(in srgb, var(--ink) 22%, var(--line)); border-radius: 2px; cursor: pointer;
    background: color-mix(in srgb, var(--panel) 97%, transparent); box-shadow: var(--sheet);
    color: var(--ink-2); white-space: nowrap; overflow: hidden; text-align: left;
    transition: width .18s var(--ease), background .15s var(--ease), color .15s var(--ease),
                border-color .15s var(--ease); }
  .index-strip .tab .ch { flex: 0 0 auto; width: 15px; text-align: center; font: 600 9.5px/1 var(--mono); color: var(--ink-2); letter-spacing: -.02em; }
  .index-strip .tab .lb { font: 600 11.5px/1 var(--serif); opacity: 0; transition: opacity .14s var(--ease); }
  .index-strip .tab .ct { margin-left: auto; padding-left: 8px; font: 10px/1 var(--mono); color: var(--ink-3);
    opacity: 0; transition: opacity .14s var(--ease); }
  .index-strip .tab:hover { width: 168px; background: var(--panel); color: var(--ink); border-color: var(--ink-3); }
  .index-strip .tab:hover .lb, .index-strip .tab:hover .ct { opacity: 1; }
  .index-strip .tab.on { color: var(--flow); border-color: color-mix(in srgb, var(--flow) 42%, var(--line)); }
  .index-strip .tab.on .ch { color: var(--flow); }

  /* ---------------- 浮层：纸片按钮 ---------------- */
  .hud { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 6px; align-items: center; z-index: 4; }
  .hud button { width: 30px; height: 30px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink-2); border-radius: 2px; cursor: pointer; font: 13px var(--mono);
    box-shadow: var(--sheet); transition: color .16s var(--ease), border-color .16s var(--ease); }
  .hud button:hover { color: var(--ink); border-color: var(--ink-3); }
  .zoom { min-width: 56px; height: 30px; display: grid; place-items: center; font: 11px var(--mono);
    color: var(--ink-3); border: 1px solid var(--line); background: var(--panel); border-radius: 2px;
    box-shadow: var(--sheet); }
  .legend { position: absolute; left: 14px; bottom: 12px; display: flex; gap: 14px; padding: 7px 11px;
    font: 11px/1 var(--sans); color: var(--ink-2);
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    border: 1px solid var(--line); border-radius: 2px; z-index: 4; box-shadow: var(--sheet); }
  .legend .toggle { cursor: pointer; user-select: none; }
  .legend .toggle.off { opacity: .38; }
  .legend i { display: inline-block; width: 20px; height: 0; border-top: 1.3px solid var(--ink-3);
    vertical-align: middle; margin-right: 7px; }
  .legend i.dep { background: none; height: 0; border-top: 1.5px dashed var(--azure); }
  .legend i.dat { background: none; height: 0; border-top: 2.2px solid var(--flow); }
  .legend i.live { border-top-color: var(--flow); }
  .legend i.cyc { border-top-style: dashed; border-top-color: var(--amber); }

  /* ---------------- 右栏：一张索引卡 ---------------- */
  .panel { border-left: 1px solid var(--line); background: var(--panel); display: flex;
    flex-direction: column; min-height: 0; position: relative; }
  .panel header { padding: 16px 18px 12px; border-bottom: 1px dashed var(--line); }
  .panel header .kicker { font: 10px/1 var(--mono); letter-spacing: .16em; color: var(--ink-3); text-transform: uppercase; }
  .panel header h1 { margin: 8px 0 5px; font: 600 18px/1.25 var(--serif); letter-spacing: .02em; }
  .panel header .p { font: 11px/1.5 var(--mono); color: var(--ink-3); word-break: break-all; }
  .panel .scroll { overflow: auto; padding: 14px 18px 20px; }
  .panel .scroll.fade { animation: fadeUp .26s var(--ease); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 2px 0 16px; }
  .fact { border: 1px solid var(--line); border-radius: 2px; padding: 8px 10px; background: var(--panel-2);
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--paper-hi) 60%, transparent); }
  .fact b { display: block; font: 600 16px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
  .fact span { font: 10.5px/1.4 var(--sans); color: var(--ink-3); }
  .sec { margin: 16px 0 7px; font: 600 10px/1 var(--mono); letter-spacing: .14em;
    color: var(--ink-3); text-transform: uppercase;
    border-bottom: 1px solid var(--line-soft); padding-bottom: 5px; }
  .sec:first-child { margin-top: 0; }
  ul.deps { list-style: none; margin: 0; padding: 0; }
  ul.deps li { padding: 6px 0; border-bottom: 1px solid var(--line-soft); font: 11.5px/1.45 var(--mono);
    color: var(--ink-2); word-break: break-all; }
  ul.deps li b { color: var(--ink); font-weight: 600; }
  ul.deps li em { color: var(--ink-3); font-style: normal; }
  .warnbox { border-left: 2px solid var(--amber); background: color-mix(in srgb, var(--amber) 9%, transparent);
    padding: 7px 10px; font: 11.5px/1.55 var(--sans); color: var(--ink-2); margin: 5px 0; }
  .intro { color: var(--ink-2); font: 12.5px/1.8 var(--serif); }
  pre.src { background: color-mix(in srgb, var(--bg) 60%, var(--panel)); border: 1px solid var(--line);
    border-radius: 2px; padding: 11px; font: 11px/1.55 var(--mono); color: var(--ink-2);
    overflow: auto; max-height: 240px; margin: 0; }
  pre.src.open { max-height: none; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--ink); font: 11.5px/1 var(--sans); padding: 7px 10px;
    border-radius: 2px; cursor: pointer; box-shadow: var(--sheet);
    transition: border-color .16s var(--ease), transform .16s var(--ease); }
  .btn:hover { border-color: var(--ink-3); }

资产影响 | `src/enrich` |\n| ⑤ 上架 | 切块 → BGE-M3 向量化 → Qdrant；默认 BM25，真实 dense 需本地栈 | `src/qa` + Qdrant |\n| ⑥ 查件 | 意图理解 → 混合检索 → 四段式带引用答案；**再结合本地仓库快照给出三个方向的解决方案** | `src/qa` |\n| ⑦ 取件 | 态势大屏 / 情报列表 / 问答页 / 资产监控等页面 | `web/` |\n\n另有四根\"承重墙\"，不属于某一条线但每条线都靠它：\n\n- **MG1 模型网关**（`src/gateway`）：所有模型调用的唯一出口，换本地/云端只改配置不改代码，兼管限流、熔断、降级、计量与 `data_domain × trust_boundary` 隔离闸门。\n- **自研 TaskGraph 编排**（`src/qa/src/orchestrator`）：把监测/富化/问答/自愈当成四个 Agent 编排，支持挂起-恢复（A-01）。\n- **兜底阶梯**（`src/qa/src/ladder`）：工具 → 规则 → 本地 Jev → 云 LLM → 人工工单。任何一层拿不准就**明说**，不硬编。\n- **Lineage 溯源账**（`src/shared`）：`trace_id` 从采集贯穿到答案，每步记输入输出哈希，可查\"这个数字从哪来\"。\n\n---\n\n## 2. 五分钟跑起来\n\n```bash\ngit clone https://github.com/Niangaol/safetrace.git && cd safetrace\ngit config core.hooksPath .githooks     # 每次 clone 后都要执行一次\nnpm ci && npm ci --prefix web           # Node >= 24，只需一次\n\nnpm run check        # 门禁四件套：typecheck + 全量单测 + 契约校验 + 前端构建\nnpm run smoke        # 端到端冒烟：fixture 回放跑完整链路，逐项 PASS\nnpm run cli:ask -- \"Log4Shell 影响哪些版本？怎么修复？\"   # 问答线 CLI 演示\n\nnpm run demo:serve   # 窗口 A：本机只读情报 API :8000（启动即实跑采集→DQ1→富化）\nnpm run dev --prefix web   # 窗口 B：前端 :5173\n```\n\n要真实语义检索（BM25 → dense）再起本地推理栈：`npm run local:up`（Qdrant :6333 + bge-m3 :8081），\n就绪检查 `npm run pilot:doctor`，实测 `npm run vector:verify`。详细步骤、环境坑、演示手测清单见 [`docs/TUTORIAL.md`](docs/TUTORIAL.md)。\n\n---\n\n## 3. 命令速查\n\n| 目的 | 命令 |\n|---|---|\n| 全量门禁 | `npm run check` |\n| 端到端冒烟（含\"零静默兜底\"断言） | `npm run smoke` |\n| 问答 CLI | `npm run cli:ask -- \"<问题>\"` |\n| 本机演示 API + 前端 | `npm run demo:serve` + `npm run dev --prefix web` |\n| 本地推理栈起停 | `npm run local:up` / `npm run local:down` |\n| 向量链就绪检查 / 实测 | `npm run pilot:doctor` / `npm run vector:verify` |"},"config/assets-scan.json":{"summary":{"text":"这个文件没有符号（没有可识别的源码结构）","src":"推断"},"path":"config/assets-scan.json","lang":"json","lines":30,"bytes":814,"parse":"file_only","symbols":[],"imports":[],"degraded":[],"snippet":"{\n  \"_comment\": \"本地资产扫描配置（分组模型 v2）。groups 仅在 var/assets.sqlite 的 groups 表为空时播种一次；之后以 Web \": \"trace_id\" },\n  \"recovery_hint\": \"人工恢复提示（可空）\"\n}\n```\n\n用户在界面必须看到降级横幅或答案尾部标注；缺标记视为缺陷。\n\n## 内联契约（QualityVerdict / TriageOrder / QueryTurn / Answer / FallbackEvent）\n\n```json\n// QualityVerdict（dq.verdicts）\n{\n  \"item_id\": \"string\",\n  \"item_kind\": \"intel | enriched\",\n  \"quality_score\": \"0-1\",\n  \"dimension_scores\": { \"structure\": 0, \"completeness\": 0, \"consistency\": 0, \"timeliness\": 0, \"sourcing\": 0 },\n  \"flags\": [\"ts_no_tz\", \"reject_status\", \"poc_dead_link\", \"key5_missing\", \"boilerplate\", \"multi_id_mismatch\", \"unknown_version\"],\n  \"injection_score\": \"0-1?\",\n  \"injection_flags\": [\"instruction_override\",\"role_confusion\",\"zero_width_chars\",\"base64_hidden\",\"html_entity_encoded\",\"comment_embedded\",\"exfil_instruction\",\"fake_system_prompt\",\"citation_spoof\",\"multi_stage\"]?,\n  \"verdict\": \"pass | degrade | review | quarantine\",\n  \"quarantine_ref\": \"string?\",\n  \"reviewer\": \"string?\",\n  \"reviewed_at\": \"ISO-8601?\",\n  \"gate_version\": \"1.0.0\"\n}\n\n// TriageOrder（enrich.triage）\n{\n  \"intel_id\": \"string\",\n  \"level\": \"P0 | P1 | P2 | P3\",\n  \"reason\": \"string\",\n  \"route\": \"full_enrich | lite_enrich | index_only\",\n  \"enrich_plan\": [{ \"dimension\": \"paper|asset|poc|cvss|remediation|triage\", \"required\": true }],\n  \"sla_deadline\": \"ISO-8601\"\n}\n\n// QueryTurn（qa.queries）\n{\n  \"session_id\": \"string\",\n  \"turn_id\": \"string\",\n  \"text\": \"string\",\n  \"history\": [{ \"role\": \"user|assistant\", \"text\": \"string\" }]\n}\n\n// Answer（qa.answers）\n{\n  \"session_id\": \"string\",\n  \"turn_id\": \"string\",\n  \"text_md\": \"string（结论—证据—推理链—置信度 四段式）\",\n  \"citations\": [{ \"chunk_id\": \"string\", \"url\": \"string\" }],"},"contracts/openapi.yaml":{"summary":{"text":"这个文件没有符号（没有可识别的源码结构）","src":"推断"},"path":"contracts/openapi.yaml","lang":"yaml","lines":218,"bytes":8154,"parse":"file_only","symbols":[],"imports":[],"degraded":[],"snippe up_name；AssetAlertRecord 追加 group_id。去重语义收窄为 group_id + component_key + cve_id（同一组件同一 CVE 在每个分组各提醒一次，分组即监控边界）。缺省语义：group_id=adhoc = 一次性扫描（旧行为），旧生产者合法；degraded_to=null = 无降级，禁止把缺省读成\"扫描完整\"。schema 文件数仍为 8。 |\n\n## v1.2.0（2026-10-09，D6 冻结后增量；A 线本地资产扫描）\n\n| 契约 | 生产者 → 消费者 | 变更与兼容性 |\n|---|---|---|\n| events.md 主题表 + 两个内联契约 | A 线扫描器/匹配器 → 前端 / A1 | **纯追加**：新增主题 `asset.scans`（AssetScanRun）与 `asset.alerts`（AssetAlertRecord）。既有主题、payload 契约、schema 文件（仍为 8 个）均未改动，旧生产者/消费者不受影响。缺省语义：`degraded_to=null` = 无降级，禁止把缺省读成\"扫描完整\"；`vendor_unverified` 恒为 true（本地扫描不携带厂商身份）；`severity` 由展示层富化，匹配器不产出，缺省 = 未富化。告警幂等键 = `component_key + cve_id`（存储层 UNIQUE 约束），重复扫描/重复匹配不产生重复提醒。 |\n\n## v1.1 汇总（D6 = 2026-10-03 契约冻结前增量，C-01～C-06）\n\n> 全部为**纯追加**：既有必填字段、枚举语义、字段含义均未改动；旧生产者与旧消费者保持兼容。\n> 缺省语义一律按\"未提供/未知\"处理，禁止消费者把缺省当作\"已筛查/已评估/可信/新鲜\"。\n\n| 台账 | 契约/配置 | 追加内容 | 状态 |\n|---|---|---|---|\n| C-01 | DecisionReply.json + openapi | `decided_by` 追加 `human` 枚举 | 代码完成，待三线 sign-off |\n| C-02 | RetrievalResponse.json（chunk） | 可选 `published_at` + `trust` | 代码完成，待三线 sign-off |\n| C-03 | QualityVerdict（events.md 内联） | 可选 `injection_score` + `injection_flags` | 代码完成，待三线 sign-off；A-04 检测已落地（2026-10-09，见 v1.1.2 条目） |\n| C-04 | Answer（events.md 内联） | 可选 `stale_warning` + `injection_guard` | 代码完成，待三线 sign-off |\n| C-05 | config/models.yml + openapi 请求体 | provider `trust_boundary` + role `data_domain` + 隔离闸门 | 代码完成，待三线 sign-off |\n| C-06 | CHANGELOG + validate_contracts.py | v1.1.x 逐条登记 + expected 集合/CHANGELOG 交叉校验 | 本轮落地 |\n\n> schema 文件数仍为 8（C-03/C-04 为 events.md 内联契约，C-05 为配置文件，均不新增 schema 文件）。\n\n## v1.1.4（2026-09-30，D6 冻结前增量；C-05）\n\n| 契约/配置 | 生产者 → 消费者 | 变更与兼容性 |\n|---|---|---|\n| 模型清单 + openapi 请求体（C-05，非 schemas/ 目录，登记备查） | MG1 调用方 → MG1 | `config/models.yml` 的 provider 追加可声明 `trust_boundary`(cloud/local/cache)、role 追加 `data_domain`(public/private)；openapi `/v1/chat/complete` 与 `/v1/embed` 请求体追加可选 `data_domain`。均为**新增可选字段**，缺省向后兼容（trust_boundary 按 provider type 推断、data_domain 缺省 public）。隔离闸门行为：`data_domain=private` 遇到 `trust_boundary=cloud` 的 provider 时**硬拒**（非 warning）并登记 FallbackEvent（degraded_of=`isolation:private->cloud`）与 lineage，不降级改投云端；仅逐级尝试 local/cache，全链无 local provider 时显式失败。数据隔离的完整实现（private 标记扫描、全链无 local 的显式失败路径）归 A-03。 |\n\n## v1.1.3（2026-09-30，D6 冻结前增量；C-04）\n\n| 契约 | 生产者 → 消费者 | 变更与兼容性 |\n|---|---|---|\n| Answer（events.md 内联） | Q4 → 前端/编排层 | 追加**可选** `stale_warning` 与 `injection_guard` 两个对象字段；既有必填集合不变，旧生产者合法（纯追加、无破坏性）。缺省语义：`stale_warning` 缺省 = 未做时效评估，禁止当作证据新鲜；`injection_guard.screened=false` 必须显式出现，禁止把未筛查读成已筛查干净。实现上 Q4 依据 C-02 的 `published_at` 判定过龄或未知并在正文输出用户可见提示，A-04 落地前 `screened` 恒为 false 并如实统计 untrusted 证据条数；A-05 将按意图细化时效阈值，本条只保证过龄或未知必须显式可见。 |\n\n## v1.1.2（2026-09-30，D6 冻结前增量；C-03）\n\n| 契约 | 生产者 → 消费者 | 变更与兼容性 |\n|---|---|---|\n| QualityVerdict（events.md 内联） | DQ1 → S1/A1、注入防护消费方 | 追加**可选** `injection_score`（0-1）与 `injection_flags`（十类注入迹象枚举）；`required` 与既有字段不变，旧生产者合法（纯追加、无破坏性）。`flags` 同步登记既有实现已在用的 `unknown_version`。**缺省 = 未做注入筛查**，禁止调用方当作“已筛查且干净”。**A-04 已于 2026-10-09 落地**：DQ1（gate 1.1.0）对 title+summary 跑共享本地启发式 `screenPromptInjection` 并如实填充两字段；命中迹象时 verdict 至少为 `review`（路由人工复核，pipeline 不放行），无法筛查时 fail-closed 同样至少 `review` 且不填字段（保持“未筛查”缺省语义）。这是**有界启发式，不是 prompt-injection 防护保证**。样例见 `fixtures/qualityverdict.injection.sample.json`，对抗样本见 `fixtures/injection/`。 |\n\n## v1.1.1（2026-09-30，D6 冻结前增量；C-02）\n\n| 契约 | 生产者 → 消费者 | 变更与兼容性 |\n|---|---|---|\n| RetrievalResponse（chunk） | Q2/来源证据构建 → Q3/Q4、前端 | chunk 追加**可选** `published_at`（date-time）与 `trust`（trusted/untrusted）；`required` 与既有字段不变，旧生产者仍合法（纯追加、无破坏性）。`published_at` 只取上游已归一化的 IntelItem.published_at（适配器已按 UTC 归一化无时区值），缺失即留空；`trust` 按来源判定：结构化权威源（NVD/KEV/CVE.org/OSV/GHSA/arXiv）及其系统派生为 trusted，网页/文档类外部文本为 untrusted。**缺省 = 未知**，消费者不得把缺省当作 trusted 或新鲜。迁移动作：Q2 已在 Qdrant 载荷中同步携带并回填两字段；消费方可在过滤/展示中按需读取，无需立即改造。 |\n\n## v1.1.0（2026-09-29，D2；契约冻结前增量）\n\n| 契约 | 生产者 → 消费者 | 变更与兼容性 |\n|---|---|---|\n| DecisionReply | D4/MG1 → Y5/Q1/Q3 调用方、`decision.replies` 订阅方 | `decided_by` 追加 `human`，为人工接管预留通道；同步 OpenAPI、TypeScript 类型和样例。原有四个值及必填字段不变，旧生产者兼容；按旧枚举严格校验的消费者需升级后才能接收人工决策。此处仅扩展契约，人工兜底运行链路归 A-02。 |\n\n## v1.0.0（2026-09-28，D1 冻结）\n\n| 契约 | 生产者 → 消费者 | 要点 |\n|---|---|---|\n| RawDoc | Y1/Y2 → Y3 | 7 必填 + parse_warnings；source_type 11 枚举 |\n| IntelItem | Y3 → F 线 | first_seen_at/published_at 双时钟分离；entities 五件套；aliases 建关联不合并 |\n| EnrichmentResult | F 线 → S1 | 每维度强制 source+confidence；source_of_score 六枚举禁静默覆盖 |\n| DecisionRequest | Y5/Q1/Q3 → MG1 | typed question 三元组 choice/score/noul，cardinality_max 255 |\n| DecisionReply | MG1 → 调用方 | decided_by 四通道如实记录，fallback_reason 必填条件化 |\n| RetrievalRequest | Q2 入口 | min_quality 下限防脏数据入检索；doc_type 过滤 |\n| RetrievalResponse | Q2 → Q3/Q4 | provenance 必填（url+section）；embedder_model_id 绑定 S3 |\n| ToolRegistration | S4 → 编排层 | 三层契约中契约层落体；exec 默认 false（F3 合规红线） |"},"contracts/schemas/DecisionReply.json":{"summary":{"text":"这个文件没有符号（没有可识别的源码结构）","src":"推断"},"path":"contracts/schemas/DecisionReply.json","lang":"json","lines":68,"bytes":1455,"parse":"file_only","symbols":[],"imports":[],"degraded":[],"snippet":"{\n  \"$schema\": \"http://json-schema.org/draft-07/schema#\",\n  \"$id\": \"https://safetrace.local/contracts/DecisionReply.json\",\n  \"title\": \"DecisionReply\",\n  \"description\": \"D4 结构化决策回复（MG1 → 调用方）。S2 主题 decision.replies 的 payload。\",\n  \"type\": \"object\",\n  \"additionalProperties\": false,\n  \"required\": [\n    \"decision_id\",\n    \"kind\",\n    \"decision\",\n    \"calibrated_prob\",\n    \"decided_by\",\n    \"schema_version\"\n  ],\n  \"properties\": {\n    \"decision_id\": {\n      \"type\": \"string\"\n    },\n    \"kind\": {\n      \"type\": \"string\",\n      \"enum\": [\n        \"y5_triage\",\n        \"q1_route\",\n        \"q3_sufficiency\",\n        \"dq_verdict\"\n      ]\n    },\n    \"decision\": {\n      \"type\": \"object\",\n      \"additionalProperties\": false,\n      \"properties\": {\n        \"choice\": {\n          \"type\": \"string\"\n        },\n        \"score\": {\n          \"type\": \"number\"\n       \"none\",\n            \"read\",\n            \"workspace-write\"\n          ]\n        },\n        \"exec\": {\n          \"type\": \"boolean\",\n          \"description\": \"F3 沙箱执行类工具默认 false；执行必须显式开关\"\n        }\n      }\n    },\n    \"state\": {\n      \"type\": \"string\",\n      \"enum\": [\n        \"staging\",\n        \"canary\",\n        \"active\",\n        \"retired\"\n      ],\n      \"description\": \"生命周期：白名单灰度\"\n    },"},"docs/PROJECT-ANALYSIS.md":{"summary":{"text":"这个文件没有符号（没有可识别的源码结构）","src":"推断"},"path":"docs/PROJECT-ANALYSIS.md","lang":"markdown","lines":166,"bytes":11587,"parse":"file_only","symbols":[],"imports":[],"degraded":[],"snippet":"# SafeTrace 项目分析报告（初学者版 · 说人话）\n\n> 写给第一次看这个项目的人。目标：**十分钟看懂它是什么、怎么跑的、现在到哪了、还差什么。**\n> 配图：[PROJECT-OVERVIEW.svg](PROJECT-OVERVIEW.svg)（项目全景图，用浏览器直接打开）\n> 数据截至 2026-10-11 ｜ 仓库：`D:/AgentPrograms/safetrace`\n> 想动手：看 [TUTORIAL.md](TUTORIAL.md)；看门面与现状：看仓库根 [README.md](../README.md)。\n\n---\n\n## 1. 一句话说清：SafeTrace 是什么\n\n**一个\"能自己查资料的漏洞情报问答系统\"。**\n\n安全工程师在对话框里打一句话——\"Ollama 那个未授权访问漏洞影响我们哪些服务？今晚先修哪个？\"——系统自己决定去查漏洞库还是翻文档，几秒后给出一个**带出处、带推理链、带修复优先级**的答案。\n\n它参加的是「中国电子杯」大赛赛题九《智能体驱动的 AI 安全知识情报系统》，作品截止 2026-10-19。\n\n---\n\n## 2. 为什么值得做（痛点）\n\n| | 人工 | SafeTrace |\n|---|---|---|\n| 耗时 | 约 6 小时 | 几十秒 |\n| 要做的事 | 刷 CVE 库 → 扒厂商公告 → 搜 PoC → 对自家资产 → 核 CVSS → 写报告 | 问一句话 |\n| 信息量 | AI 安全漏洞**每天新增 4 万多条**，分散在七八个渠道 | 自动汇聚 7 类源 |\n\n**核心矛盾**：情报太多看不完，现有工具又只会\"关键词匹配\"，听不懂人话。\n\n---\n\n## 3. 系统怎么跑的（把流水线当成快递分拣）\n\n```\n7 类情报源  →  Y 监测线  →  情报对象  →  F 富化线  →  知识底座  →  Q 问答线  →  网页\n（收件）      （分拣）      （贴单）      （加工）      （上架）      （查件）     （取件）\n```\n\n| 步骤 | 干什么 | 代码在哪 |\n|---|---|---|\n| **① 收件** | 从 CISA KEV、NVD、OSV、cve.org、Ubuntu USN 等源抓数据（7 类登记、5 个连接器在跑） | `src/ingest` |\n| **② 分拣** | 统一格式 → 去重归并（同一个漏洞四套编号合成一条）→ **DQ1 质量闸门**打分，脏货进隔离区 | `src/ingest` |\n| **③ 贴单** | 生成不可变的 `IntelItem`（情报对象），带上来源和哈希 | `contracts/schemas` |\n| **④ 加工** | 富化：关联论文、补 CVSS/EPSS 评分、给修复建议、校验冲突、评估本地资产影响 | `src/enrich` |\n| **⑤ 上架** | 切块 → BGE-M3 向量化 → 存进 Qdrant，可语义检索（默认 BM25，dense 需起本地栈） | Qdrant + `src/qa` |\n| **⑥ 查件** | 理解问题 → 混合检索 → 合成四段式答案，每条结论都带引用 | `src/qa` |\n| **⑦ 取件** | 网页：态势大屏、情报列表、问答页、资产监控等页面 | `web/` |\n\n**另外还有一条\"本地资产线\"（A 线）**：扫描本机 git 仓库/项目目录的依赖清单，生成技术栈快照，\n再和情报做确定性版本匹配——所以问答不只是分析问题，还能结合**你自己的仓库**给出三个方向的解决方案。\n\n**2026-10-11 内部 Agent 时效增量**：新入口把“源完成→持久交接→快速CVSS/EPSS→验证索引准备”接通，原始来源先可问答，不等慢富化。timely档NVD30分钟、KEV15分钟，仍遵守官方限流；旧结果受事件版本与token检查，失败/停机有持久续接。全量909/909及受控集成测试通过，**没有因此证明实源6h SLA或72h生产运行**。操作与边界见 [教程§7](TUTORIAL.md#7-时效与指标口径评分类指标唯一口径)。\n\n**四根\"承重墙\"**，不属于某一条线但每条线都靠它：\n\n- **MG1 模型网关**（`src/gateway`）：所有模型调用的唯一出口。换本地/云端模型只改配置、不改代码；还管限流、熔断、降级、计量。\n- **自研 TaskGraph 编排**（`src/qa/src/orchestrator`）：把\"监测/富化/问答/自愈\"当成四个 Agent 编排起来，支持挂起-恢复。\n- **兜底阶梯**（`src/qa/src/ladder`）：工具 → 规则 → 本地 Jev → 云 LLM → 人工。任何一层拿不准就**明说**，不硬编。\n- **Lineage 溯源账**（`src/shared`）：`trace_id` 从采集贯穿到答案，每步记输入输出哈希，可查\"这个数字从哪来\"。\n\n---\n\n## 4. 三个关键设计（评委最可能追问）\n\n**① 为什么所有模型调用都必须走 MG1 网关？**\n大赛宣讲会的明确红线：接口要标准化、与系统解耦、能灵活切换本地或云端模型。所以代码里禁止 `import` 任何模型厂商 SDK，切换只改 `config/models.yml` 一行。\n\n**② 为什么判断类任务不交给大模型？**\n大模型会\"编\"。所以路由、分级、证据充分性这类**结构化判断**交给 Jev（只能从给定选项里选的决策模型，输出受 schema 约束，不会幻觉）；大模型只负责最后\"说人话\"。Jev 是闭源服务，已设计同构降级。\n\n**③ 为什么脏数据要单独隔离？**\n情报源天然脏：网页说改版就改版、同一漏洞四套编号、时间戳时区混乱、POC 链接失效、CVE 有 REJECT/RESERVED 状态。**宁可少一条，不可错一条**——错一条会污染整个知识库。\n\n**④（加分项）为什么问答能给出\"解决方案\"却不会瞎编？**\n因为方案只从两类硬事实里长出来：本地扫描出的依赖清单（`var/assets.sqlite`）和已发布情报里的版本规则。\n升级目标版本必须取自 Ubuntu USN / CISA KEV 公告原文，本系统不做跨生态包名映射；范围约束下界、同名跨生态、扫描降级都会显式提示\"无法判定\"。\n**unknown 不等于安全**——这条贯穿整个项目。\n\n---\n"},"docs/TUTORIAL.md":{"summary":{"text":"这个文件没有符号（没有可识别的源码结构）","src":"推断"},"path":"docs/TUTORIAL.md","lang":"markdown","lines":398,"bytes":28563,"parse":"file_only","symbols":[],"imports":[],"degraded":[],"snippet":"# SafeTrace 项目 Tutorial（从零到演示）\n\n> 这份文档是**动手向**的唯一手册：原来的 `LOCAL-STACK` / `LOCAL-DEMO` / `MONITORING-METRICS` / `GITHUB-FLOW` /\n> `HANDOVER` / `TEAM-PLAN` / `TASKS` / `ASSET-SCAN` / `QA-ADAPTIVE-UI` / `ENRICHMENT-*` / `P10-LOCAL-VERIFY` /\n> `P07-DEMO-PLAN` / `JEV-*` / `FRONTEND-COMPETITION-UI` / `EFFECTS-LAYER` / 各日期报告等已全部合并到这里。\n> 想先\"看懂项目\"请看 [`PROJECT-ANALYSIS.md`](PROJECT-ANALYSIS.md) + [`PROJECT-OVERVIEW.svg`](PROJECT-OVERVIEW.svg)，\n> 门面与现状看仓库根 [`README.md`](../README.md)。\n>\n> **三条路线**：只想看项目 → PROJECT-ANALYSIS；想跑起来 → 本文件 §2–§4；想改代码 → 本文件 §5–§13。\n\n---\n\n## 1. 开始之前\n\n### 1.1 环境要求\n\n| 项 | 要求 | 说明 |\n|---|---|---|\n| Node | **>= 24** | `node -v` 确认；`npm ci` 一次即可。**在 Node 26 上已验证通过**（2026-10-12：门禁 909/909）；若升级大版本，先复核安全类测试是否被客户端\"好心\"拒绝（见 1.2 最后一行） |\n | Git hooks | `git config core.hooksPath .githooks` | **每次 clone 后都要执行一次**，否则提交信息/推送门禁不生效 |\n | 磁盘 | 本地推理栈另需约 5 GB | 模型目录默认 `../safetrace-models`，Qdrant 二进制在 `D:\\AgentPrograms\\qdrant\\` |\n | NVD API key | 可选但建议 | 免费，邮箱激活链接 7 天有效；无 key 限流 5 req/30s |\n\n### 1.2 环境坑（都踩过，别再踩）\n\n| 症状 | 原因 | 处理 |\n|---|---|---|\n | `tsc: command not found` / 找不到 typescript | 依赖没装全 | `npm ci`（根目录） |\n | esbuild 报 `Access is denied` / 无法建临时文件 | esbuild 在系统 TEMP 建临时文件被安全策略拒 | 先 `mkdir -p .tmp`，再把 `TEMP`/`TMP` 指到仓库内 `.tmp` |\n | 测试报 `EXDEV: cross-device link not permitted` | 临时目录与工作盘不在同一卷（如 `C:\\Users\\...\\Temp` vs `D:\\AgentPrograms\\safetrace`） | 把 `TMPDIR` 指到工作区所在卷，或在该测试里改用同卷临时目录 |\n | `bash: couldn't create signal pipe` | Windows 上 Git Bash 的信号管道被环境限制 | 用 `pwsh`/`cmd` 或直接在 Node 里 `spawnSync` |\n | 前端请求 5xx / 白屏 | 后端没起，或用了静态演示模式 | 前端**默认只请求真实后端，拿不到就报错，不静默回退假数据**；要静态演示必须显式 `VITE_DEMO_MODE=true` |\n | **安全测试假绿**：断言\"服务端拒绝恶意请求\"的用例突然全绿/全红但行为没变 | Node 26 起 `http.request` 的 `options.headers` 里写 `Host` 会被**客户端**强校验（`ERR_INVALID_ARG_VALUE`），请求根本没发到服务端，断言退化成了\"客户端自己报错\" | 测 Host 头/源站校验这类**服务端**安全断言，必须用 `net.connect` 裸 socket 手写请求行，让请求真正到达服务端；每次 Node 大版本升级后复核这类用例（2026-10-12 实测踩中并修复） |\n\n---\n\n## 2. 第一次跑起来（10 分钟）\n\n```bash\nnpm ci && npm ci --prefix web\n\nnpm run check      # 门禁四件套：typecheck + 全量单测 + 契约校验 + 前端构建\nnpm run smoke      # 端到端冒烟：fixture 回放跑完整链路，逐项 PASS（含\"零静默兜底\"断言）\nnpm run cli:ask -- \"Log4Shell 影响哪些版本？怎么修复？\"\nnpm run trace:lineage -- <上一步输出的 trace_id>   # 看这条答案的处理 DAG\n```\n\n冒烟脚本覆盖的关键断言（演示时可以直接念）：20 条黄金问答、零静默兜底、A-06 自愈演练、\nA-05 时效过滤、P-05 多源冲突、P-03 版本影响、A-01 挂起/恢复、A-02 人工工单、A-06 常驻自愈。\n\n---\n\n## 3. 本机演示（双窗口）\n\n```powershell\nnpm run demo:serve        # 窗口 A：127.0.0.1:8000 只读情报 API（启动即实跑离线采集→DQ1→富化）\nnpm run dev --prefix web  # 窗口 B：127.0.0.1:5173 前端\n```\n\n建议手测清单：\n\n```powershell\nInvoke-RestMethod http://127.0.0.1:8000/api/v1/health\nInvoke-RestMethod 'http://127.0.0.1:8000/api/v1/vulns?page=1&page_size=10'\nInvoke-RestMethod http://127.0.0.1:8000/api/v1/metrics/overview\n# 问答（SSE 流式）\n$body = @{ question = \"CVE-2021-44228 如何修复？\" } | ConvertTo-Json\nInvoke-RestMethod -Method Post -Uri \"http://127.0.0.1:8000/api/v1/qa/chat\" -ContentType \"application/json\" -Body $body\n```\n\n**LLM 调用边界**：演示链路默认 `cache` provider + fixture 回放，`answer_mode=template`，`model_calls=0`，不产生任何费用；\n要接真实模型只在设置页保存密钥并显式 apply，且 `data_domain=private` 的上下文硬拒出云。\n\n**前端数据来源规则（最容易被误解的一处）**：默认只请求真实后端，失败即报错；\n只有 `VITE_DEMO_MODE=true` 才进静态演示模式，并且全站横幅标注。fixture 必须带 `data_mode`/`mock` 标识，费用显示 `—`。\n\n---\n\n## 4. 本地推理栈（Qdrant + bge-m3 + llama.cpp，无 Docker）\n"},"docs/evidence/freshness-72h.json":{"summary":{"text":"这个文件没有符号（没有可识别的源码结构）","src":"推断"},"path":"docs/evidence/freshness-72h.json","lang":"json","lines":228,"bytes":6729,"parse":"file_only","symbols":[],"imports":[],"degraded":[],"snippet":"{\n  \"generated_at\": \"2026-10-04T04:56:24.990Z\",\n  \"metric_version\": \"1.2.0\",\n  \"lag_definition\": \"lag = first_seen_at − published_at（秒）；按漏洞去重（cve_ids[0] 优先，退回 intel_id），取组内最早 first_seen_at\",\n  \"percentile_method\": \"nearest-rank（向上取整），空集返回 null\",\n  \"window\": {\n    \"start\": \"2026-10-01T02:32:24.896Z\",\n    \"end\": \"2026-10-04T04:56:24.896Z\"\n  },\n  \"monitor_start\": \"2026-10-01T02:51:31.422Z\",\n  \"sample_basis\": \"严格口径只计 published_at ≥ 监控起点的条目；参考口径计窗口内全部真实条目\",\n  \"data_basis\": \"live\",\n  \"overall\": {\n    \"n\": 912,\n    \"p50_seconds\": 5217,\n    \"p95_seconds\": 17950,\n    \"max_seconds\": 28766,\n    \"sla_6h_ratio\": 0.9912\n fter-func-final` / `after-wired` 为已弃用的自由文本兜底中间结果，已移入 `archive/`。\n> 项目文档已合并为三份：根 [`README.md`](../../../README.md)、[`PROJECT-ANALYSIS.md`](../../PROJECT-ANALYSIS.md)（配 [`PROJECT-OVERVIEW.svg`](../../PROJECT-OVERVIEW.svg)）、[`TUTORIAL.md`](../../TUTORIAL.md)。\n\n## 固定基准与口径\n\n- [独立期望](<../../../fixtures/qa-quality/reference.v1.json>)：24 题、12 个合成证据块、17 项期望事实。首次运行前手工设定，未从系统实际答案反推；SHA256：  `1e9f07cef10e032cb1ba4270ecc7bfa0c74a2cd60b79c4e083e1d63358febec2`。测试锁定该 SHA；不要为修复后的答案调整期望。\n- 合成 CVE / 产品 / 论文均为测试数据，`qa.invalid` 非真实来源。证据中显式列出版本边界，因而版本题通过只能说明事实搬运未丢失，不代表执行了通用版本推理。\n- 固定评测时钟为 2026-10-10T14:00:00Z。覆盖 concept、version 边界/未知、remediation/未知、multi-CVE、time/stale、paper、有冲突的 CVSS、输入/证据 injection、clarify/refusal。\n- 评分：每题每项 check 等权，题内通过 check 比例为 score；汇总为所有题 score 算术平均。`fully_passing` 是全部机械检查通过的题数，不是现实世界准确率。\n- fact coverage：独立正则在 actual answer 中命中，且非 abstained；先去除整段原问题以防回显作弊。包含证据全文也会命中，**不保证答案理解或结论正确**。\n- citation support：期望事实指定的 source ID 必须出现在 citations，且 ID/URL 与本轮检索块绑定。是可核查的来源代理检查，不是自动语义蕴涵验证。\n- q21/q22 的期望采用严格拒答契约：未知具体版本/具体修复版本应 abstain；实际给出有用但保守的“未知/无已核验版本”也可能被记为该契约不匹配，不自动证明发生幻觉。\n- 论文题只检查合成标题/来源与缺资料拒答。没有人工标注真实论文相关性池，**不计算论文 recall / precision**。\n- 延迟为单暖进程 Q1→检索→Q4→natural→评分，不含索引构建、HTTP、真实模型与 Qdrant；不是端到端 SLA。BM25 分数 top 归一为 1，不能当作校准相关性/概率。\n\n## 实际执行链路\n\n[runner](<../../../scripts/qa-quality-evaluate.ts>) 直接调用生产 Q1 / MemoryIndex BM25 / buildRetrievalRequest / Q4 / naturalConclusion；paper_related 使用生产 live 的 paper 过滤，abstained 时不追加自然结论。它**不调用 HTTP live server**，不接 live 的基线缺口、只读 guidance、资产 assessment、runtime model review/UI，所以这些接线不在本 probe 的验证范围。\n\n已检查 [live server](<../../../scripts/live-intel-server.ts>)、[preview](<../../../scripts/knowledge-preview.ts>)、[natural](<../../../scripts/natural-answer.ts>)、[review](<../../../scripts/final-answer-review.ts>)、[knowledge reader](<../../../src/qa/src/knowledge-reader.ts>)、[baseline reader](<../../../src/qa/src/baseline-reader.ts>)、[remediation reader](<../../../src/qa/src/remediation-reader.ts>) 和 [现有黄金问答](<../../../fixtures/golden-qa.v0.json>)。旧黄金集以意图/CVE 字样为主，对版本/冲突事实不充分，且历史热点题依赖旧 fixture，故这里独立定义新事实。\n\n模型复核器只是结构/引用片段/数字约束，不是独立事实评审；本次未启用模型复核。没有恢复/checkpoint/幂等安全指标。\n\n## 修复前结果\n\n[before.json](<before.json>) / [before.md](<before.md>) 保存逐题实际答案、期望、检索证据、计划、引用、评分/失败理由和延迟。首次结果：18/24 全检查通过；mean check score 0.9003；fact coverage 16/17；expected-source-backed facts 16/17；过度拒答 0，漏拒答 4；p50 0.1905ms、p95 2.6235ms。\n\n六题失败：q08/q09 多 CVE 部分覆盖却放行；q18 无冲突显式披露；q21 未知 version 不拒答；q22 缺具体修复版本不拒答；q24 第二 CVE 的自然评分覆盖不全。代码检查另发现潜在跨 CVE 身份错配，但此 baseline 的两个错配禁用检查实际均通过，不能称为在 q24 复现了错配。生产缺陷已报告 Lead，由 Lead 修复；评测者不改生产代码。\n\n## 修复后直接函数链（保持原 runner 接线）\n\n[after-func.json](<after-func.json>) / [after-func.md](<after-func.md>)：19/24 全检查通过；mean check score 0.9003（并未提升）；fact coverage 14/17；有期待来源支持 14/17；过度拒答 2，漏拒答 1；p50 0.1620ms、p95 1.6481ms。期望 SHA 完全相同。\n\nq08/q09/q21 已按严格拒答契约关闭；但 q03/q04 原文有明确版本事实却没有传 version_impact，被新门禁拒答（原 runner 不提供该规则接线），所以不能宣称整体质量全面改善。q18 未显式解释冲突；q22 的具体升级版本仍未拒答；q24 只输出首 CVE 的自然分数，第二个分数缺失；本题 before/after 错配禁用断言都通过，实际复现的是缺失而非错误身份。后续如果新增 live 接线，必须另记模式，与原 before/after-func 不能混称完全相同链路。\n\n## 中间已弃用的自由文本版本兜底结果与 caller 差异\n\n| 模式 | 全 check 通过题数 | mean check score | fact/source coverage | 过拒 / 漏拒 | p50 / p95 ms |\n| --- | ---: | ---: | ---: | ---: | ---: |\n| [修复前](<before.json>) legacy-first-cve | 18/24 | 0.9003 | 16/17 | 0 / 4 | 0.1905 / 2.6235 |\n| [中间直接链](<after-func.json>) legacy-first-cve | 19/24 | 0.9003 | 14/17 | 2 / 1 | 0.1620 / 1.6481 |\n| [中间直接链（已弃用）](<archive/after-func-final.json>) legacy-first-cve | 23/24 | 0.9896 | 16/17 | 0 / 0 | 0.2424 / 1.8900 |\n| [中间 caller 接线（已弃用）](<archive/after-wired.json>) live-multi-cve | 24/24 | 1.0000 | 17/17 | 0 / 0 | 0.2349 / 1.7802 |\n\n每行均使用同一冻结期望 SHA。完整历史答案/检查见 [中间直接链 Markdown](<archive/after-func-final.md>) / [中间接线版 Markdown](<archive/after-wired.md>)。两份已弃用中间结果（含 json）已于 2026-10-11 移入 `archive/`，正文只留成绩记录、不再与权威结果同目录陈列，避免误引为当前水平；不安全的自由文本版本兜底逻辑已从生产代码移除，因此该阶段的高分不能作为当前安全实现成绩。\n\n上述中间直接链当时仅 q24 第二个 CVE 的自然评分事实缺失；本集错配禁用断言均通过，但这不表示穷尽了所有排序/跨 CVE 组合。当时的自由文本逐版本状态兜底降低了过拒，独立 review 后证明它能被非结构化/不可信文字误导，Lead 已彻底移除。exact/all-CVE、显式冲突提示、具体修复版本否定句门禁保留；版本判定现在只接受绑定的结构化 version_impact。\n\n`--live-natural-scope` 的**唯一 caller 差异**：多 CVE 时给 naturalConclusion 的 cve_id 从首个 CVE 改为 null（仅一个 CVE 仍严格绑定）；这与修后的生产 live caller 一致。它不改期望、不添加模型、不人工塞 source_conflicts/version_impact。`metadata.runner_wiring` 明确区分 `legacy-first-cve` 与 `live-multi-cve`。before→after-func-final 为同 caller 接线比较；after-wired 是功能接线后成绩，**不能将它与 before 说成完全相同链路的因果对照**。\n\n该已弃用中间阶段的 24/24 只表示当时此小型合成契约集所有定义的机械 checks 满足，**不是比赛准确率 100%、真实安全知识正确率或论文召回**。完整 live HTTP / baseline/guidance / 真实库端到端回归由 Lead 另外执行登记。\n\n## 最终安全代码结果（权威现状）\n\n安全 review 发现自由文本版本状态兜底存在 P1 风险后，Lead 删除 explicitVersionImpact。评测者只复跑生产函数，**不调整冻结期望、不人工传 version_impact、不以通过率为理由恢复不安全兜底**。\n\n| 最终模式 | 全 check 通过题数 | mean check score | fact/source coverage | 冻结契约过拒 / 漏拒 | invalid citations | p50 / p95 ms |\n| --- | ---: | ---: | ---: | ---: | ---: | ---: |\n| [after-safe-func](<after-safe-func.json>) legacy-first-cve | 21/24 | 0.927083 | 14/17 | 2 / 0 | 0 | 0.2180 / 1.7066 |\n| [after-safe-wired](<after-safe-wired.json>) live-multi-cve | 22/24 | 0.937500 | 15/17 | 2 / 0 | 0 | 0.2095 / 1.6987 |\n\n逐题 actual answer、期望、引用与检查见 [安全直接链 Markdown](<after-safe-func.md>) / [安全 natural 接线版 Markdown](<after-safe-wired.md>)。两模式期望 SHA 仍为 `1e9f07cef10e032cb1ba4270ecc7bfa0c74a2cd60b79c4e083e1d63358febec2`；evaluator 测试再次 8/8。\n\n两模式都失败 q03/q04：合成原文有“2.4.0 受影响 / 2.5.0 不受影响”，独立原始契约期望可答，但当前安全门禁不把自由文字当结构版本依据，且此 probe **没有接入绑定的 version_impact**，所以实际保守拒答，按冻结契约记为2项 overrefusal。这是安全性与该 probe 回答覆盖的权衡，**不是错误的版本结论或新幻觉**。不能为避免计分下降改期望。\n\n安全 legacy 模式另失败 q24：仍用首 CVE 调 natural，第二 CVE 的自然分值缺失；安全 wired 模式仅更改多 CVE 的自然 caller 为 null，解决 q24，没有额外注入版本规则。\n\n同 caller 比较 before→after-safe-func：18/24→21/24，漏拒4→0，但契约过拒0→2、事实/指定来源覆盖16/17→14/17。natural 接线版从已弃用的24/24下降到最终22/24。这些下降必须如实报告；不表示应该放宽安全门禁。结构 citation_binding 的 invalid 数为0也不等于自动语义蕴涵正确。\n\n**与产品实际 live 入口的区别**：Lead 另有实际 HTTP 回归验证基于 source/DQ/projection 绑定的结构化版本规则。那条入口传入 bound version_impact，本 probe 只接 production Q1/BM25/Q4/natural，没有该版本适配层，因此这里的2项保守拒答不能直接推断为 live 产品同样拒答；反之，HTTP 回归通过也不能当作这24题全部通过。我没有在本次重跑中自行执行或验证 Lead 的 HTTP 回归。\n\n## 可复跑命令\n\n工作目录仓库根，无 .env 加载，不启动服务、不重启模型或 Qdrant：\n\n```sh"},"docs/evidence/qa-quality/after-func.json":{"summary":{"text":"这个文件没有符号（没有可识别的源码结构）","src":"推断"},"path":"docs/evidence/qa-quality/after-func.json","lang":"json","lines":3530,"bytes":159293,"parse":"file_only","symbols":[],"imports":[],"degraded":[],"snippet":"{\n  \"reference_sha256\": \"1e9f07cef10e032cb1ba4270ecc7bfa0c74a2cd60b79c4e083e1d63358febec2\",\n  \"metadata\": {\n    \"mode\": \"synthetic-fixture\",\n    \"answer_mode\": \"template\",\n    \"retrieval_mode\": \"bm25-lite-v1\",\n    \"evaluation_now\": \"2026-10-10T14:00:00Z\",\n    \"model_calls\": 0,\n    \"business_writes\": 0,\n    \"vector_writes\": 0,\n    \"network_calls\": 0,\n    \"scope\": \"Direct production Q1/MemoryIndex/Q4/naturalConclusion functions; NOT HTTP/live-reader/guidance/baseline enrichment end-to-end. No runtime checkpoint test.\",\n    \"provenance\": \"Authored synthetic test facts, not real CVE claims. Expectations specified independently before first evaluation; no answers were used as labels. qa.invalid is deliberately non-resolvable. Paper recall needs human relevance annotation; no corpus-wide paper recall metric.\",\n    \"limitations\": [\n      \"Synthetic contract probe, NOT competition accuracy\",\n      \"Fact regex coverage may be verbatim evidence copying, not reasoning quality\",\n      \"Per-fact source binding is a checkable proxy; full semantic citation entailment needs human review\",\n      \"No human-annotated paper relevance pool: paper recall not measured\",\n      \"Single warm process latency, no HTTP/model/Qdrant/end-to-end SLA measurement\",\n      \"BM25 max-normalized score is not calibrated relevance\"\n    ]\n  },\n  \"aggregate\": {\n    \"questions\": 24,\n    \"fully_passing\": 19,\n    \"mean_check_score\": 0.9002976190476191,\n    \"facts_expected\": 17,\n
