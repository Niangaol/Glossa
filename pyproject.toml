[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glossa"
version = "0.1.0"
description = "笺疏 Glossa：把任意代码仓库讲成单文件离线讲解页；附 PaperTrace，把 PyTorch 算子图与论文公式项逐项对账"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Niangaol" }]
keywords = [
    "pytorch",
    "torch-export",
    "dataflow",
    "static-analysis",
    "code-explanation",
    "glossa",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["jsonschema>=4.20", "jinja2>=3.1"]

[project.urls]
Homepage = "https://github.com/Niangaol/Glossa"
Repository = "https://github.com/Niangaol/Glossa"
Issues = "https://github.com/Niangaol/Glossa/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["papertrace*", "glossa*", "glossa.*"]

[tool.setuptools.package-data]
"glossa" = ["templates/*.j2", "templates/styles/*.css", "schema/*.json"]
"papertrace" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
