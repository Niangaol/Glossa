name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # 只跑 Windows：真实追踪走 torch.export，本项目的开发与验证环境就是
    # Windows + CPU 版 torch（见 docs/ENVIRONMENT.md），先用同一个平台把
    # 1299 项跑绿，别拿没验证过的 Linux 结果充数。
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: 装依赖（开发依赖 + CPU 版 torch）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: pytest
        run: python -m pytest -q
